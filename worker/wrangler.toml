name = "ai-proxy"
main = "index.js"
compatibility_date = "2026-01-01"

[vars]
# The site's origin, exactly — no trailing slash, no path.
# Only this origin may call the Worker; "*" would let any site spend your API credit.
ALLOWED_ORIGIN = "https://studyplatform.co.uk"

# Where the app lives, used for the one-tap setup links the admin panel builds.
SITE_ORIGIN = "https://studyplatform.co.uk"

# The account the recovery console (/admin) can mint an invite for. Adding students,
# invites and caps all happen inside the app, under its Admin tab.
ADMIN_USERNAME = "chris"
ADMIN_NAME = "Chris"

# Recovery console (/admin). Off until BOTH of these are set AND a Cloudflare Access
# policy sits in front of /admin* — the Worker verifies the Access token's signature,
# issuer, audience and expiry on every request, and refuses without one.
ACCESS_TEAM_DOMAIN = "hoppyc.cloudflareaccess.com"
ACCESS_AUD = "b77150c77c9a5256b929ff1708b80cc7ee7bf334a7c45b237ed690cc2427cf08"

# Course building runs as durable Workflows: a build survives minutes of model calls with per-step
# retries and reports progress; the reviewer is what the monthly cron starts, one instance per course.
[[workflows]]
name = "course-builder"
binding = "COURSE_BUILDER"
class_name = "CourseBuilder"

[[workflows]]
name = "course-review"
binding = "COURSE_REVIEW"
class_name = "CourseReview"

# Depth: after a course is published, every room's lesson, worked examples, question bank, exit ticket and
# cards are written by one model and checked by another, four rooms at a time.
[[workflows]]
name = "course-depth"
binding = "COURSE_DEPTH"
class_name = "CourseDepth"

# The monthly pass: 06:00 UTC on the first of the month. It HEAD-checks each course's document and
# only reads it again if it changed, so most months it costs nothing.
[triggers]
crons = ["0 6 1 * *"]

# Accounts, sessions, invites, progress, usage counts, courses and their provenance all live here.
[[kv_namespaces]]
binding = "USAGE"
id = "236116d082d047559b1e5c94337412de"

# The per-room desktop's files: photos of notes and classwork, PDFs. Create the bucket first in the
# dashboard (R2 → Create bucket → studyplatform-desk); until it exists the desktop answers "not set up yet".
# The index of each student's items and the 250 MB quota live in KV (desk:<user>:<room>, deskq:<user>).
[[r2_buckets]]
binding = "DESK"
bucket_name = "studyplatform-desk"

# ANTHROPIC_API_KEY and USER_KEYS are secrets — never put them in this file.
# Set them in the dashboard under Settings -> Variables and Secrets, or with
# `npx wrangler secret put ANTHROPIC_API_KEY` and `npx wrangler secret put USER_KEYS`.
