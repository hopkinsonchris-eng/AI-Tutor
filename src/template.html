<!DOCTYPE html>

<style>/*__CSS__*/
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.chip{border:1.5px solid var(--rule);border-radius:20px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:600;background:#fff;cursor:pointer;color:var(--pencil)}.chip[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.tcell{text-align:left;border:1.5px solid var(--rule);border-radius:3px;background:#fff;padding:10px;font:inherit;cursor:pointer;color:var(--ink)}.tcell b{display:block;font-size:12px;color:var(--pencil)}.tcell span{font-size:14px;font-weight:600;line-height:1.3;display:block;margin-top:2px}.tcell i{font-size:11.5px;color:var(--pencil)}
.tcell[data-s="Learning"]{background:#FDF6E7;border-color:var(--amber)}.tcell[data-s="Fluent"]{background:#EAF0F8;border-color:var(--blue)}.tcell[data-s="Secure"]{background:#EDF5F0;border-color:var(--green)}
.card{border:1.5px solid var(--rule);border-radius:3px;padding:22px 16px;text-align:center;background:#fff;margin-top:10px;font-size:17px;line-height:1.5}.card .back{color:var(--green);margin-top:12px;font-weight:600}
.cite{font-size:11px;font-weight:700;color:var(--blue);border:1.5px solid var(--blue);border-radius:2px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.lvl{display:inline-block;font-size:32px;font-weight:700;letter-spacing:-.03em}
</style>

<body>
<header><div class="wrap hbar"><button class="edge" data-drawer="l" aria-label="Courses and topics" title="Courses and topics">▤</button><div class="hmid"><div class="hdate" id="hDate">—</div><div class="hphase" id="hPhase">Loading…</div></div><div class="gradechip" id="hGrade"></div><button class="edge" data-drawer="r" aria-label="Now: next step, cards, resources" title="Now">◧</button></div></header>
<div class="shell" id="shell">
 <aside class="rail rail-l hide" id="rail-l" aria-label="Courses and topics" aria-expanded="false"></aside>

</nav>
<script>
/*__CORE__*/
/*__GEN__*/
/*__SPECS__*/

/*__CONFIG__*/
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='platform:state:v1', MATHS_KEY='companion:state:v2', SESSION_KEY='platform:session';
const AUTH_MODE=!!(typeof CONFIG!=='undefined'&&CONFIG.tutorUrl);let AUTH={user:null,token:null};
function stateKey(){return AUTH_MODE&&AUTH.user?KEY+':'+AUTH.user.username:KEY;}
let COURSES={catalogue:[],courses:{},building:{},depth:{}},SPEC_META={};const SPEC_CACHE='platform:spec:v1:';
/* Room kits: the depth the Worker wrote and checked for a built course, fetched per room and cached on the device by build stamp. */
let KITS={};const KIT_CACHE='platform:kit:v1:';
/* Hand-built kits ship with the site (KIT_INDEX, dist/kits/); Worker-built ones come from the tutor. Either way a room's kit is fetched on first open and cached by build stamp. */
function kitInfo(specId,topicId){const bi=typeof KIT_INDEX!=='undefined'&&KIT_INDEX[specId];if(bi&&bi[topicId])return {at:bi[topicId],failed:false,building:false,builtIn:true};if(bi)return null;const d=COURSES.depth&&COURSES.depth[specId];if(!d)return null;const at=d.done&&d.done[topicId];return {at:at||null,failed:(d.failed||[]).includes(topicId),building:d.status==='building'};}
async function ensureKit(specId,topicId){if(AUTHORED[specId])return false;const info=kitInfo(specId,topicId);if(!info||!info.at)return false;const key=specId+'|'+topicId;if(KITS[key]&&KITS[key].built&&KITS[key].built.at===info.at)return false;
  try{const c=JSON.parse(await rawGet(KIT_CACHE+key)||'null');if(c&&c.built&&c.built.at===info.at){KITS[key]=c;return true;}}catch(e){}
  try{let kit;if(info.builtIn){const res=await fetch('./kits/'+encodeURIComponent(specId)+'/'+encodeURIComponent(encodeURIComponent(topicId))+'.json');if(!res.ok)return false;kit=JSON.parse(await res.text());}else{if(!AUTH_MODE)return false;kit=(await api('/courses/'+encodeURIComponent(specId)+'/kit/'+encodeURIComponent(topicId))).kit;}
    KITS[key]=kit;try{await rawSet(KIT_CACHE+key,JSON.stringify(kit));}catch(e){}return true;}catch(e){return false;}}
/* Courses built by the Worker join the built-in specs at runtime. A copy is kept on the device so a student who has a course keeps it even if it is later withdrawn for new students. */
async function loadCourses(){if(!AUTH_MODE||!AUTH.user)return;try{COURSES=await api('/courses');}catch(e){}}
async function ensureSpec(id){const stamp=x=>(x&&x.resources&&x.resources.at)||'';if(SPECS[id]&&!(SPEC_META[id]&&COURSES.courses[id]&&stamp(COURSES.courses[id])&&stamp(COURSES.courses[id])!==stamp(SPEC_META[id])))return true;
  try{const r=await api('/courses/'+encodeURIComponent(id)+'/spec');SPECS[id]=r.spec;SPEC_META[id]=r.meta;try{await rawSet(SPEC_CACHE+id,JSON.stringify(r));}catch(e){}return true;}
  catch(e){try{const c=JSON.parse(await rawGet(SPEC_CACHE+id)||'null');if(c&&c.spec){SPECS[id]=c.spec;SPEC_META[id]=c.meta;return true;}}catch(e2){}return false;}}
async function ensureSpecsFor(state){if(!state||!state.setup)return;for(const sub of state.setup.subjects)await ensureSpec(sub.specId);}
function courseIdFor(board,code){const P={'aqa':'AQA','pearson edexcel':'EDX','edexcel':'EDX','ocr':'OCR','eduqas':'EDQ','wjec':'WJEC'};return (P[String(board).toLowerCase()]||String(board).replace(/[^A-Za-z]/g,'').slice(0,5).toUpperCase())+'-'+String(code).toUpperCase();}
function offer(level){const subj={};const put=(subject,board,code,id,builtIn)=>{const st=COURSES.courses[id];if(st&&st.status==='retracted'&&!SPECS[id])return;(subj[subject]=subj[subject]||[]);if(!subj[subject].some(x=>x.id===id))subj[subject].push({board,code,id,builtIn,status:SPECS[id]?'ready':st?st.status:(COURSES.building[id]?'building':'none')});};
  for(const sp of Object.values(SPECS))if(sp.level===level)put(sp.subject,sp.board,sp.code,sp.id,true);
  for(const q of COURSES.catalogue)if(q.level===level)put(q.subject,q.board,q.code,q.id,false);
  for(const k of Object.keys(subj))subj[k].sort((a,b)=>a.board.localeCompare(b.board));return subj;}
function pushSubject(id){if(!UI.setup.subjects.some(x=>x.specId===id))UI.setup.subjects.push({specId:id,options:{}});}
let S=null, TODAY=new Date().toISOString().slice(0,10), view='today', saveErr='', storeMode='memory';
let syncState={at:0,serverAt:'',busy:false,err:'',pending:false,timer:null};const SYNC_GAP=AUTH_MODE?15000:60000;
let UI={subject:null,room:null,station:'lesson',revealed:{},practice:null,essay:null,exit:null,busy:'',err:'',coachBusy:false,coachErr:'',teach:{},setup:{subjects:[]},cards:null,mathsHours:0,drawer:null,jumpQ:'',nudgeBusy:false};
const specById=id=>SPECS[id];
const authoredFor=(specId,topicId)=>{const A=AUTHORED[specId];if(A){const room=A.rooms[topicId];if(!room)return null;return{room,lesson:A.lessons[topicId],sources:A.sources[topicId],official:A.official};}
  const k=KITS[specId+'|'+topicId];if(!k)return null;const sp=SPECS[specId];const t=sp&&sp.topics.find(x=>x.id===topicId);return{kit:k,room:{name:t?t.name:topicId,formulae:k.room.facts||[],examples:k.lesson.examples||[],questions:k.room.questions||[],exit:k.room.exit||[]},lesson:k.lesson,sources:null,official:null,extras:k.extras||[],cards:k.cards||[]};};
const MATHS_MODES={'ALGEBRAIC-SLIP':'RECALL-GAP','METHOD-CHOICE':'APPLICATION','CONCEPT-GAP':'KNOWLEDGE-GAP','EXAM-TECHNIQUE':'EXAM-TECHNIQUE','RECALL-GAP':'RECALL-GAP'};
const nodeTopic=id=>{const n=S.nodes[id];const sp=specById(n.spec);return {spec:sp,topic:sp.topics.find(t=>t.id===n.topic),n};};
const subjectOptions=specId=>(S.setup.subjects.find(x=>x.specId===specId)||{}).options||{};

/* ============ storage (as in the Maths companion) ============ */
async function detectStore(){try{if(window.storage&&typeof window.storage.set==='function'){const r=await window.storage.set('platform:ping','1');if(r)return 'cloud';}}catch(e){}try{localStorage.setItem('platform:ping','1');localStorage.removeItem('platform:ping');return 'local';}catch(e){}return 'memory';}
async function rawGet(k){if(storeMode==='cloud'){try{const r=await window.storage.get(k);return r&&r.value?r.value:null;}catch(e){return null;}}if(storeMode==='local'){try{return localStorage.getItem(k);}catch(e){return null;}}return null;}
async function rawSet(k,v){if(storeMode==='cloud'){const r=await window.storage.set(k,v);if(!r)throw new Error('cloud save returned nothing');return;}if(storeMode==='local'){try{localStorage.setItem(k,v);return;}catch(e){throw new Error('device storage full or blocked');}}throw new Error('no storage available');}
let MATHS=null;
async function mirrorMaths(){if(!S||!MATHS)return;if(!S.setup.subjects.some(x=>x.specId==='EDX-9MA0'))return;for(const [mid,mn] of Object.entries(MATHS.nodes||{})){const id='EDX-9MA0|'+mid;if(S.nodes[id]&&!S.nodes[id].imported){S.nodes[id].state=mn.state;S.nodes[id].lastPractised=mn.lastPractised;S.nodes[id].imported=true;}}
  for(const p of (MATHS.papers||[])){if(!S.papers.some(x=>x.mirror===p.date+p.key+p.score)){S.papers.push({spec:'EDX-9MA0',component:p.key==='P3'||p.key==='M3'?'P3':'P12',series:p.series||p.kind,date:p.date,score:p.score,total:p.total,mirror:p.date+p.key+p.score});}}}
function normaliseState(){if(!S)return;for(const k of ['errors','transitions','practice','essays','papers'])if(!S[k])S[k]=[];for(const k of ['cards','generated','coach','pins','doneToday','coldDone','checklist','boundaries','dayHours','pinned','kitCards'])if(!S[k])S[k]={};}
/* Signed in: the copy on the tutor is the truth; the device copy is a cache, and is adopted (and pushed) only when the tutor has nothing yet. */
async function loadForUser(){S=null;UI.room=null;let server=null;try{server=await api('/progress');}catch(e){if(e.status!==404)syncState.err=e.message;}
  let local=null;try{local=JSON.parse(await rawGet(stateKey())||'null');}catch(e){}
  if(server&&server.state&&server.state.nodes&&server.state.setup){S=server.state;syncState.at=Date.now();syncState.serverAt=server.updatedAt||'';}
  else if(local&&local.nodes&&local.setup){S=local;syncState.pending=true;}
  else{let old=null;try{old=JSON.parse(await rawGet(KEY)||'null');}catch(e){}
    const mine=old&&old.nodes&&old.setup&&AUTH.user&&String(old.setup.student||'').trim().toLowerCase()===String(AUTH.user.name||'').trim().toLowerCase();
    if(mine){S=old;syncState.pending=true;}}
  if(S)delete S.tutor;
  await loadCourses();await ensureSpecsFor(S);if(S){S.setup.subjects=S.setup.subjects.filter(sub=>SPECS[sub.specId]);if(!S.setup.subjects.length)S=null;}
  try{MATHS=JSON.parse(await rawGet(MATHS_KEY)||'null');if(MATHS&&MATHS.dayHours)UI.mathsHours=MATHS.dayHours[TODAY]||0;UI.mathsPresent=!!MATHS;}catch(e){}
  await mirrorMaths();normaliseState();if(S&&syncState.pending){await save();pushSync();}}
async function load(){let got=null;try{got=JSON.parse(await rawGet(KEY)||'null');}catch(e){}if(got&&got.nodes&&got.setup)S=got;
  try{MATHS=JSON.parse(await rawGet(MATHS_KEY)||'null');if(MATHS&&MATHS.dayHours)UI.mathsHours=MATHS.dayHours[TODAY]||0;UI.mathsPresent=!!MATHS;}catch(e){}
  await mirrorMaths();
  if(S){for(const k of ['errors','transitions','practice','essays','papers'])if(!S[k])S[k]=[];for(const k of ['cards','generated','coach','pins','doneToday','coldDone','checklist','boundaries','dayHours','pinned','kitCards'])if(!S[k])S[k]={};}}
async function save(){if(!S)return;if(storeMode==='memory'){saveErr='Saving isn\u2019t available where this is open — back up from Progress before you close.';return;}try{await rawSet(stateKey(),JSON.stringify(S));saveErr='';queueSync();}catch(e){saveErr=`Could not save (${e.message}). Back up from Progress.`;}renderStatus();}
/* ---- talking to the tutor service ---- */
async function api(path,opts={}){const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(AUTH.token)headers.Authorization='Bearer '+AUTH.token;
  let res;try{res=await fetch(CONFIG.tutorUrl+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});}catch(e){const err=new Error('No connection to the tutor');err.status=0;throw err;}
  let data={};try{data=JSON.parse(await res.text()||'{}');}catch(e){}
  if(res.status===401&&AUTH.token&&!/^\/auth\/(login|invite|password)/.test(path)){await signedOut();const err=new Error('Signed out');err.status=401;throw err;}
  if(!res.ok){const err=new Error(data.error||('HTTP '+res.status));err.status=res.status;throw err;}return data;}
async function signedOut(){AUTH={user:null,token:null};try{await rawSet(SESSION_KEY,'');}catch(e){}S=null;UI.room=null;UI.setup={subjects:[]};syncState={at:0,serverAt:'',busy:false,err:'',pending:false,timer:null};renderAll();}
function syncable(){return AUTH_MODE?!!(AUTH.token&&S):!!(S&&S.tutor&&S.tutor.url&&S.tutor.pass);}
function deviceName(){try{const u=(typeof navigator!=='undefined'&&navigator.userAgent)||'';return /iPad/.test(u)?'an iPad':/iPhone/.test(u)?'an iPhone':/Android/.test(u)?'an Android device':/Macintosh/.test(u)?'a Mac':/Windows/.test(u)?'a PC':'a device';}catch(e){return 'a device';}}
function queueSync(){if(!syncable())return;syncState.pending=true;if(syncState.timer)return;const wait=Math.max(2000,SYNC_GAP-(Date.now()-syncState.at));syncState.timer=setTimeout(()=>{syncState.timer=null;pushSync();},wait);}
async function pushSync(){if(!syncable()||syncState.busy||!syncState.pending)return;syncState.busy=true;
  try{let b;if(AUTH_MODE){b=await api('/progress',{method:'PUT',body:{device:deviceName(),state:S}});}
    else{const res=await fetch(S.tutor.url+'/progress',{method:'PUT',headers:{'Content-Type':'application/json','X-Passcode':S.tutor.pass},body:JSON.stringify({device:deviceName(),state:S})});if(!res.ok)throw new Error('HTTP '+res.status);b=JSON.parse(await res.text());}
    syncState.at=Date.now();syncState.serverAt=b.updatedAt||'';syncState.err='';syncState.pending=false;}
  catch(e){syncState.err=e.message||'failed';}
  finally{syncState.busy=false;if(view==='prog')renderProg();renderStatus();}}
async function pullSync(){if(!syncable())throw new Error(AUTH_MODE?'Sign in first.':'Set the tutor route first.');let b;
  if(AUTH_MODE){try{b=await api('/progress');}catch(e){throw new Error(e.status===404?'Nothing has been saved to the tutor yet.':e.message);}}
  else{const res=await fetch(S.tutor.url+'/progress',{headers:{'X-Passcode':S.tutor.pass}});if(res.status===404)throw new Error('Nothing has been backed up to the tutor yet.');if(!res.ok)throw new Error('HTTP '+res.status);b=JSON.parse(await res.text());}
  if(!b||!b.state||!b.state.nodes||!b.state.setup)throw new Error('The copy on the tutor is not readable.');return b;}
function hashParam(name){try{const h=(typeof location!=='undefined'&&location.hash)||'';const m=new RegExp('[#&]'+name+'=([^&]+)').exec(h);return m?decodeURIComponent(m[1]):'';}catch(e){return '';}}
function clearHash(){try{if(typeof history!=='undefined'&&history.replaceState)history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
/* Legacy route-less build: a setup link (#route=...&key=...) sets the tutor route in one tap. */
function applySetupLink(){if(AUTH_MODE)return;try{const u=hashParam('route').trim(),k=hashParam('key').trim();if(!/^https:\/\//.test(u)||!k)return;
  const route={url:u.replace(/\/$/,''),pass:k};if(S){S.tutor=route;save();}else{PENDING_ROUTE=route;}clearHash();}catch(e){}}
let PENDING_ROUTE=null;
function withT(id,fn){const b=S.nodes[id].state;fn();const a=S.nodes[id].state;if(b!==a)S.transitions.push({date:TODAY,node:id,from:b,to:a});}
function addHours(h){S.hours=(S.hours||0)+h;S.dayHours[TODAY]=(S.dayHours[TODAY]||0)+h;}

/* ============ API (retrying, diagnosable) ============ */
const RETRY=new Set([408,409,425,429,500,502,503,504,529]);let LAST_API_ERROR=null;
async function callClaude(parts,max=1500,retries=6){let lastErr='';for(let a=0;a<=retries;a++){if(a)await new Promise(r=>setTimeout(r,Math.min(8000,600*Math.pow(2,a-1))+Math.random()*400));let res;
  const route=AUTH_MODE?{url:CONFIG.tutorUrl,headers:{'Content-Type':'application/json','Authorization':'Bearer '+(AUTH.token||'')}}:(S&&S.tutor&&S.tutor.url)?{url:S.tutor.url,headers:{'Content-Type':'application/json','X-Passcode':S.tutor.pass||''}}:{url:'https://api.anthropic.com/v1/messages',headers:{'Content-Type':'application/json'}};
  try{res=await fetch(route.url,{method:'POST',headers:route.headers,body:JSON.stringify({model:'claude-sonnet-5',max_tokens:max,messages:[{role:'user',content:parts}]})});}catch(e){lastErr='network';continue;}
  let raw='';try{raw=await res.text();}catch(e){lastErr='unreadable body';continue;}
  let data=null;try{data=JSON.parse(raw);}catch(e){lastErr='HTTP '+res.status+', non-JSON reply: '+(raw||'(empty)').slice(0,120)+(!raw?' — the tutor route isn\u2019t reaching Claude from here':'');LAST_API_ERROR={status:res.status,body:raw.slice(0,400),when:new Date().toISOString()};if(a<retries)continue;break;}
  if(AUTH_MODE&&res.status===401){await signedOut();throw new Error('You were signed out — sign in again to carry on.');}
  if(!res.ok||(data&&data.type==='error')){const m=(data&&data.error&&data.error.message)||('HTTP '+res.status);lastErr=res.status===429?'rate limited':res.status===529||res.status===503?'service busy':('HTTP '+res.status+': '+m);LAST_API_ERROR={status:res.status,body:raw.slice(0,400),when:new Date().toISOString()};if(RETRY.has(res.status))continue;break;}
  const text=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').replace(/```json|```/g,'').trim();if(!text){lastErr='empty reply';continue;}return text;}
  throw new Error(lastErr||'unknown');}
/* Generate JSON, validate against the spec, retry once with the validator's complaint. */
async function generate(prompt,validator,max=2500){let txt=await callClaude([{type:'text',text:prompt}],max);let obj=null;try{obj=JSON.parse(txt);}catch(e){}
  let why=obj?validator(obj):'not JSON';
  if(why){txt=await callClaude([{type:'text',text:prompt+`\n\nYour previous attempt was rejected: ${why}. Fix that and respond again with ONLY the JSON.`}],max);try{obj=JSON.parse(txt);}catch(e){obj=null;}why=obj?validator(obj):'not JSON';}
  if(why)throw new Error('generated content failed validation: '+why);return obj;}
async function ensure(kind,id,builder,validator,max){S.generated[id]=S.generated[id]||{};if(S.generated[id][kind])return S.generated[id][kind];UI.busy=`Preparing ${kind}…`;renderRooms();
  try{const o=await generate(builder(),validator,max);S.generated[id][kind]=o;UI.err='';await save();return o;}catch(e){UI.err=e.message;return null;}finally{UI.busy='';}}

/* ============ SETUP ============ */
function renderSetup(){const el=document.getElementById('v-setup');const st=UI.setup;const editing=!!S;st.level=st.level||'A level';
  const levels=['GCSE','A level'];const avail=new Set([...Object.values(SPECS).map(sp=>sp.level),...COURSES.catalogue.map(q=>q.level)]);
  const offered=offer(st.level);const subjects=Object.keys(offered).sort();const subjSel=st.pickSubject&&offered[st.pickSubject]?st.pickSubject:subjects[0]||'';const boards=offered[subjSel]||[];const boardSel=boards.find(b=>b.id===st.pickBoard)?st.pickBoard:(boards[0]&&boards[0].id)||'';
  const chosen=st.subjects.map(sub=>SPECS[sub.specId]).filter(Boolean);
  const b=UI.build;const pct=b&&b.build&&b.build.total?Math.round(100*(b.build.done||0)/b.build.total):5;
  el.innerHTML=`<div class="panel">${editing?'<button class="open" id="suCancel">← Back without changing</button>':''}<h2>${editing?'Add or change subjects':'Set up your study environment'}</h2>${!editing&&isAdmin()?'<div class="note">Running the platform rather than studying on it? You don’t need rooms — adding students, invites and caps are all under the <b>Admin</b> tab below. Fill this in only if you want rooms of your own.</div>':''}<p class="sub">Choose your level, then a subject and its exam board, and add it. If the platform hasn’t mapped that course yet it builds it from the board’s own specification while you wait — a few minutes — and then adds it. The platform builds a room for every topic you actually study.</p>
   <label for="suName">First name</label><input id="suName" value="${esc(st.student||(AUTH.user&&AUTH.user.name)||'')}" placeholder="e.g. Matthew"><label for="suYear">Exam summer</label><select id="suYear">${[2027,2028,2029].map(y=>`<option ${st.examYear===y||(!st.examYear&&y===2028)?'selected':''}>${y}</option>`).join('')}</select>
   <h3>Level</h3><div class="row">${levels.map(l=>`<button class="act ghost small" data-level="${l}" aria-pressed="${st.level===l}" ${avail.has(l)?'':'disabled'} style="${st.level===l?'background:var(--ink);color:var(--paper)':''}">${l}${avail.has(l)?'':' — coming'}</button>`).join('')}</div>

/* Adding a course: instant if the platform has it; otherwise the Worker builds it and the box shows progress. */
async function addCourse(level,subject,boardId){const off=offer(level);const pick=(off[subject]||[]).find(x=>x.id===boardId);if(!pick)return;const id=pick.id;
  if(SPECS[id]||(await ensureSpec(id))){pushSubject(id);UI.build=null;renderSetup();return;}
  if(!AUTH_MODE){renderSetup();return;}
  UI.build={id,level,subject,board:pick.board,status:'starting',message:'Starting…',joined:false};renderSetup();
  try{const r=await api('/courses/build',{method:'POST',body:{level,subject,board:pick.board,code:pick.code}});
    if(r.status==='published'){if(await ensureSpec(id)){pushSubject(id);UI.build=null;}renderSetup();return;}
    UI.build=Object.assign(UI.build,{status:r.status,build:r.build||null,joined:!!r.joined,message:(r.build&&r.build.message)||r.message||r.error||''});renderSetup();
    if(r.status==='building')setTimeout(()=>pollBuild(id),CONFIG.pollMs||3000);}
  catch(e){UI.build=Object.assign(UI.build,{status:'failed',message:e.message});renderSetup();}}
async function pollBuild(id){if(!UI.build||UI.build.id!==id)return;
  try{const st=await api('/courses/'+encodeURIComponent(id)+'/status');UI.build.build=st.build;UI.build.status=st.status;UI.build.message=(st.build&&st.build.message)||UI.build.message;
    if(st.status==='published'){if(await ensureSpec(id)){pushSubject(id);UI.build=null;}else{UI.build.status='failed';UI.build.message='Built, but it could not be loaded — try again.';}renderSetup();return;}
    if(st.status==='building'){renderSetup();setTimeout(()=>pollBuild(id),CONFIG.pollMs||3000);return;}
    if(st.status==='review')UI.build.message='Built, and being checked by Chris before it goes live — you can add it once it’s approved.';
    renderSetup();}
  catch(e){UI.build.status='failed';UI.build.message=e.message;renderSetup();}}
function presetBoundaries(){for(const sub of S.setup.subjects){const A=AUTHORED[sub.specId];if(A&&A.boundaries&&!S.boundaries[sub.specId]){const b=A.boundaries.overall[0];const total=300;S.boundaries[sub.specId]={};for(const g of ['A*','A','B','C','D','E'])S.boundaries[sub.specId][g]=Math.round(b[g]/total*100);}}}

  for(const k of ['errors','essays','practice','transitions'])S[k]=S[k].filter(x=>!x.node||S.nodes[x.node]);for(const k of Object.keys(S.cards))if(!S.nodes[S.cards[k].node])delete S.cards[k];}

function renderRoom(el){const {spec,topic,n}=nodeTopic(UI.room);const st=UI.station;const AU=authoredFor(spec.id,topic.id);const factsLabel=AU&&AU.kit&&(SPEC_META[spec.id]||{}).family!=='quantitative'?'Key facts & links':'Formulae & links';const tabs=[['lesson','Lesson'],...(AU?[['formulae',factsLabel]]:[]),['cards','Cards'],['practise','Practise'],['essay',spec.essaySubject?'Essay':'Exam question'],['mark','Mark'],['exit','Exit ticket'],['coach','Coach']];let body='';

function courseOrder(){const pinned=S.pinned||{};return S.setup.subjects.slice().sort((a,b)=>(pinned[b.specId]?1:0)-(pinned[a.specId]?1:0));}
function activeSpec(){return specById((UI.subject&&S.setup.subjects.some(x=>x.specId===UI.subject))?UI.subject:S.setup.subjects[0].specId);}
function renderRailL(L){const sp=activeSpec();const due=new Set(dueForReview(S,TODAY));
  const cards=courseOrder().map(sub=>{const c=specById(sub.specId);const p=predictSubject(S,c,sub.options);const pin=!!(S.pinned&&S.pinned[c.id]);return `<div class="ccard${c.id===sp.id?' on':''}"><button class="cmain" data-course="${esc(c.id)}"><b>${esc(c.subject)}</b><small>${esc(c.board)} ${esc(c.code)}</small><span class="cg">${esc(p.grade)}</span></button><div class="bar mini"><i style="width:${p.pct}%"></i></div><button class="pin" data-pin="${esc(c.id)}" aria-pressed="${pin}" title="${pin?'Unpin':'Pin to the top'}">${pin?'★':'☆'}</button></div>`;}).join('');
  const nodes=Object.entries(S.nodes).filter(([,n])=>n.spec===sp.id);
  const tree=sp.components.map(c=>{const mine=nodes.filter(([,n])=>{const t=sp.topics.find(x=>x.id===n.topic);return t&&t.component===c.id;});if(!mine.length)return '';return `<div class="comp"><div class="cname">${esc(c.name)} · ${c.weight}%</div>${mine.map(([id,n])=>{const t=sp.topics.find(x=>x.id===n.topic);const ki=!AUTHORED[sp.id]?kitInfo(sp.id,t.id):null;return `<button class="tnode${UI.room===id?' cur':''}" data-open="${esc(id)}" data-st="lesson"><i class="dot" data-s="${n.state}"${due.has(id)?' data-due="1"':''}></i><span><small>${esc(t.id)}</small> ${esc(t.name)}${ki&&!ki.at?'<i class="pen" title="Being written">✎</i>':''}</span></button>`;}).join('')}</div>`;}).join('');
  L.innerHTML=`${navHtml('side')}<div class="rblock"><input id="jump" placeholder="Jump to a topic or code…" autocomplete="off" value="${esc(UI.jumpQ||'')}"><div id="jumpOut">${jumpHtml()}</div></div><div class="rblock"><h4>Courses</h4>${cards}</div><div class="rblock"><h4>Where you are · ${esc(sp.subject)}</h4><div class="tree">${tree}</div><div class="legend" style="margin-top:10px"><span><i class="dot" data-s="Unassessed"></i>New</span><span><i class="dot" data-s="Learning"></i>Learning</span><span><i class="dot" data-s="Fluent"></i>Fluent</span><span><i class="dot" data-s="Secure"></i>Secure</span><span><i class="dot" data-due="1"></i>Due</span></div></div>
   <div class="rblock account"><button class="act ghost small" data-act="courses">＋ Add or change courses</button>${AUTH_MODE?`<p class="fine">Signed in as <b>${esc((AUTH.user&&AUTH.user.name)||'')}</b>${isAdmin()?' (admin)':''}</p><button class="act ghost small" data-act="signout">Sign out</button>`:''}</div>`;}
function jumpMatches(q){q=String(q||'').trim().toLowerCase();if(q.length<2)return [];const first=[],later=[];
  for(const sub of S.setup.subjects){const sp=specById(sub.specId);if(!sp)continue;for(const [id,n] of Object.entries(S.nodes)){if(n.spec!==sp.id)continue;const t=sp.topics.find(x=>x.id===n.topic);if(!t)continue;
    if(t.name.toLowerCase().includes(q)||String(t.id).toLowerCase().includes(q))first.push({id,sp,t,hit:null});
    else{const k=(t.ideas||[]).find(i=>String(i.code).toLowerCase().includes(q)||String(i.idea||'').toLowerCase().includes(q)||String(i.content||'').toLowerCase().includes(q));if(k)later.push({id,sp,t,hit:k});}}}
  return first.concat(later).slice(0,8);}
function jumpHtml(){if(String(UI.jumpQ||'').trim().length<2)return '';const m=jumpMatches(UI.jumpQ);return m.length?m.map(x=>`<button class="tnode" data-open="${esc(x.id)}" data-st="lesson"><i class="dot" data-s="${S.nodes[x.id].state}"></i><span><small>${esc(x.sp.subject)} · ${esc(x.t.id)}</small> ${esc(x.t.name)}${x.hit?`<br><small>${esc(x.hit.code)} ${esc(x.hit.idea)}</small>`:''}</span></button>`).join(''):'<div class="empty">No topic matches.</div>';}
function ringHtml(pct,grade,label){const r=15.9;return `<div class="ringwrap"><svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="${r}" fill="none" stroke="#E6E1D5" stroke-width="3"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="#2E6B4E" stroke-width="3" stroke-dasharray="${Math.max(0,Math.min(100,pct))} 100" stroke-linecap="round" transform="rotate(-90 18 18)"/><text x="18" y="21.5" text-anchor="middle" font-size="10" font-weight="700" fill="#191D23">${esc(grade)}</text></svg><div><b>${esc(label)}</b><small>${pct}% · predicted ${esc(grade)}</small></div></div>`;}
function linkHtml(l){return `<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.t)}<small>${esc(l.why||'')}</small></span><span class="lgo">${l.kind==='video'?'▶':'→'}</span></a>`;}
/* Every course gets links: the maths course's hand-checked ones, a built course's checked hub pages and per-topic links, and searches that always exist. */
function resourcesFor(spec,topic){const AU=authoredFor(spec.id,topic.id);const out=[];if(AU&&AU.sources){for(const x of (AU.sources.tl||[]))out.push({t:'TLMaths — '+x.t,url:x.url,kind:'video',why:'Spec-ordered videos, hand-checked'});if(AU.sources.es)out.push({t:'ExamSolutions tutorials',url:AU.sources.es,kind:'video',why:'Find '+((AU.room&&AU.room.name)||topic.name)});}
  return out.concat(topicLinks(spec,topic));}

/* The next-step nudge: one small tutor call a day, cached in state; a deterministic sentence when the tutor cannot be asked. */

    S.nudge={date:TODAY,text:o.text.trim().slice(0,240),node:o.node&&S.nodes[o.node]?o.node:null,station:['lesson','cards','practise','essay','exit'].includes(o.station)?o.station:'lesson',ai:true};}

  const stn=t.closest('[data-station]');if(stn){UI.station=stn.dataset.station;UI.revealed={};UI.err='';renderRooms();return;}
  const rv=t.closest('[data-reveal]');if(rv){UI.revealed[rv.dataset.reveal]=true;renderAll();return;}
  const lx=t.closest('[data-lxrev]');if(lx){const k='lx'+lx.dataset.lxrev;UI.revealed[k]=(UI.revealed[k]||0)+1;renderRooms();return;}
  const ax=t.closest('[data-axrev]');if(ax){const k='ax'+ax.dataset.axrev;UI.revealed[k]=(UI.revealed[k]||0)+1;renderRooms();return;}
  if(t.closest('[data-kitcards]')){const {spec,topic}=nodeTopic(UI.room);const AU=authoredFor(spec.id,topic.id);if(AU&&AU.cards&&!(S.kitCards||{})[UI.room]){for(const c of AU.cards){const cid='c'+Math.random().toString(36).slice(2,9);S.cards[cid]={node:UI.room,front:c.front,back:c.back,code:c.code,due:TODAY,ease:1,reps:0};}S.kitCards=S.kitCards||{};S.kitCards[UI.room]=true;await save();}renderRooms();return;}
  if(t.closest('[data-cards]')){UI.cards=true;UI.revealed.card=false;go('today');renderToday();return;}
  const cr=t.closest('[data-cardres]');if(cr){const c=S.cards[cr.dataset.card];const okk=cr.dataset.cardres==='1';scheduleCard(c,okk,TODAY);if(!okk){S.errors.unshift({date:TODAY,node:c.node,ref:'Card: '+c.front.slice(0,60),mode:'RECALL-GAP',fix:c.back});}S.nodes[c.node].lastPractised=TODAY;addHours(0.02);UI.revealed.card=false;await save();renderAll();return;}
  const gk=t.closest('[data-genkind]');if(gk){genFor(gk.dataset.genkind,!!gk.dataset.regen);return;}
  if(t.id==='retryGen'){UI.err='';renderRooms();return;}
  if(t.closest('[data-ahint]')){UI.apr.hints[UI.apr.i]=(UI.apr.hints[UI.apr.i]||0)+1;renderRooms();return;}
  if(t.closest('[data-anewset]')){const {spec,topic,n}=nodeTopic(UI.room);const AU=authoredFor(spec.id,topic.id);UI.apr={room:UI.room,qs:pickAuthored(AU.room,n.state,4),i:0,results:[],hints:{}};UI.revealed={};renderRooms();return;}
  if(t.closest('[data-usegen]')){UI.useGenerated=true;UI.practice=null;renderRooms();return;}
  const apr=t.closest('[data-apres]');if(apr){const P=UI.apr,q=P.qs[P.i],h=P.hints[P.i]||0;if(apr.dataset.apres==='miss'){document.getElementById('missMode').classList.remove('hide');return;}const okk=apr.dataset.apres==='ok';const mode=okk?null:document.getElementById('pMode').value;P.results.push({ok:okk,hints:h});S.practice.push({date:TODAY,node:UI.room,ok:okk,hints:h,marks:q.m});
    if(okk)withT(UI.room,()=>recordResult(S,UI.room,{examStandard:q.d>=2,allCorrect:h===0,interleaved:false},TODAY));else{S.errors.unshift({date:TODAY,node:UI.room,ref:q.q.slice(0,80),mode,fix:q.sol,hints:h});withT(UI.room,()=>recordWrong(S,UI.room,mode,TODAY));}addHours(q.m*2/60);P.i++;await save();renderAll();return;}
  const pr=t.closest('[data-pres]');if(pr){const {n}=nodeTopic(UI.room);const Q=S.generated[UI.room]['questions-'+n.state];const P=UI.practice;const q=Q.questions[P.i];if(pr.dataset.pres==='miss'){document.getElementById('missMode').classList.remove('hide');return;}const okk=pr.dataset.pres==='ok';const mode=okk?null:document.getElementById('pMode').value;P.results.push({ok:okk});S.practice.push({date:TODAY,node:UI.room,ok:okk,marks:q.marks});
    if(okk)withT(UI.room,()=>recordResult(S,UI.room,{examStandard:q.marks>=8,allCorrect:true,interleaved:false},TODAY));else{S.errors.unshift({date:TODAY,node:UI.room,ref:q.q.slice(0,80),mode,fix:q.indicative[0]});withT(UI.room,()=>recordWrong(S,UI.room,mode,TODAY));}addHours(q.marks/60);P.i++;await save();renderAll();return;}
  const xt=t.closest('[data-exit]');if(xt){const {spec,topic,n}=nodeTopic(UI.room);const qs=exitQuestions(spec,topic);UI.exit.res[xt.dataset.exit]=xt.dataset.res==='1';if(Object.keys(UI.exit.res).length===qs.length){const right=Object.values(UI.exit.res).filter(Boolean).length;for(const [i,v] of Object.entries(UI.exit.res))if(!v)S.errors.unshift({date:TODAY,node:UI.room,ref:'Exit: '+qs[i].q.slice(0,60),mode:'RECALL-GAP',fix:qs[i].a});if(right>=Math.min(3,qs.length)){withT(UI.room,()=>recordResult(S,UI.room,{taught:true},TODAY));if(n.state!=='Unassessed')n.taught=TODAY;}addHours(0.1);await save();}renderAll();return;}
  if(t.closest('[data-fluency]')){const mine=Object.values(S.cards).filter(c=>c.node===UI.room);if(mine.length<10){UI.err='Generate at least 10 cards for this room first.';renderRooms();return;}UI.cards=true;UI.fluencyRoom=UI.room;go('today');renderToday();return;}
  if(t.id==='esStart'){const {spec,topic}=nodeTopic(UI.room);const marks=+document.getElementById('esMarks').value;UI.busy='Setting a question…';renderRooms();try{const F=await generate(essayQuestionPrompt(spec,topic,marks),o=>validateEssayQ(topic,o,marks),2000);UI.essay={room:UI.room,frame:F,photos:[],text:'',result:null};UI.err='';}catch(e){UI.err=e.message;}UI.busy='';renderRooms();return;}
  if(t.id==='esPhotoBtn'){document.getElementById('esPhoto').click();return;}
  if(t.id==='mkPhotoBtn'){document.getElementById('mkPhoto').click();return;}if(t.id==='mkAnother'){UI.mark=null;renderRooms();return;}
  if(t.id==='mkGo'){const M=UI.mark;const {spec,topic}=nodeTopic(UI.room);M.q=document.getElementById('mkQ').value.trim();M.text=document.getElementById('mkText').value.trim();M.marks=+document.getElementById('mkMarks').value||8;if(!M.text&&!M.photos.length){UI.err='Photograph the question and answer, or type them.';renderRooms();return;}UI.busy='Marking…';UI.err='';renderRooms();
    try{const parts=M.photos.map(p=>({type:'image',source:{type:'base64',media_type:p.media,data:p.data}}));parts.push({type:'text',text:markEssayPrompt(spec,topic,M.q||'(in the photograph)',M.marks,M.text,!!M.photos.length)});let txt=await callClaude(parts,3000);let R=null;try{R=JSON.parse(txt);}catch(e){}const why=R?validateMarking(topic,R,M.marks):'not JSON';if(why)throw new Error('marking failed validation: '+why);M.result=R;
      if(R.failureMode!=='NONE'){S.errors.unshift({date:TODAY,node:UI.room,ref:(M.q||'Photographed question').slice(0,80),mode:R.failureMode,fix:R.fix,score:`${R.mark}/${R.max}`});withT(UI.room,()=>recordWrong(S,UI.room,R.failureMode,TODAY));}
      withT(UI.room,()=>recordResult(S,UI.room,{examStandard:M.marks>=6,allCorrect:R.mark===R.max,interleaved:false},TODAY));addHours(M.marks/60);await save();}catch(e){UI.err=e.message;}UI.busy='';renderRooms();return;}
  if(t.id==='esCancel'){UI.essay=null;renderRooms();return;}if(t.id==='esAnother'){UI.essay=null;renderRooms();return;}
  if(t.id==='esMark'){const E=UI.essay;const {spec,topic}=nodeTopic(UI.room);E.text=document.getElementById('esText').value.trim();if(!E.text&&!(E.photos&&E.photos.length)){UI.err='Photograph the pages or type the essay first.';renderRooms();return;}UI.busy='Marking…';UI.err='';renderRooms();
    try{const parts=(E.photos||[]).map(p=>({type:'image',source:{type:'base64',media_type:p.media,data:p.data}}));parts.push({type:'text',text:markEssayPrompt(spec,topic,E.frame.q,E.frame.marks,E.text,!!(E.photos&&E.photos.length))});
      let txt=await callClaude(parts,3000);let R=null;try{R=JSON.parse(txt);}catch(e){}const why=R?validateMarking(topic,R,E.frame.marks):'not JSON';if(why)throw new Error('marking failed validation: '+why);E.result=R;
      S.essays.push({date:TODAY,node:UI.room,q:E.frame.q,marks:E.frame.marks,level:R.level,maxLevel:R.maxLevel,mark:R.mark,max:R.max,mode:R.failureMode});
      if(R.failureMode!=='NONE'){S.errors.unshift({date:TODAY,node:UI.room,ref:E.frame.q.slice(0,80),mode:R.failureMode,fix:R.fix,score:`${R.mark}/${R.max}`});withT(UI.room,()=>recordWrong(S,UI.room,R.failureMode,TODAY));}
      withT(UI.room,()=>recordResult(S,UI.room,{essayLevel:R.level,examStandard:true,allCorrect:R.level>=R.maxLevel-0,interleaved:false},TODAY));addHours((spec.markConventions.essayShapes.find(s=>s.marks===E.frame.marks)?.minutes||30)/60);await save();}
    catch(e){UI.err=e.message;}UI.busy='';renderRooms();return;}
  if(t.closest('[data-teach]')){UI.teach[UI.room]=true;UI.station='coach';renderRooms();const inp=document.getElementById('coachIn');if(inp)inp.value='Teach me this topic from the start.';askCoach(false);return;}
  if(t.id==='coachGo'){askCoach(false);return;}if(t.id==='coachRetry'){askCoach(true);return;}
  if(t.id==='coachClear'){S.coach[UI.room]=[];UI.teach[UI.room]=false;UI.coachErr='';await save();renderRooms();return;}
  if(t.id==='coachCopy'){const inp=document.getElementById('coachIn');const q=inp?inp.value.trim():'';const hist=S.coach[UI.room]=S.coach[UI.room]||[];if(q){hist.push({role:'user',text:q});inp.value='';await save();}const txt=coachText();const out=document.getElementById('coachCopyOut');try{await navigator.clipboard.writeText(txt);out.innerHTML='<div class="good">Copied. Paste into the Claude app.</div>';}catch(e){out.innerHTML=`<textarea class="mono" style="min-height:120px">${esc(txt)}</textarea>`;}return;}
  const dl=t.closest('[data-dl]');if(dl&&!UI.dojoDone){const j=+dl.dataset.dl;UI.dojoSel=UI.dojoSel||[];const at=UI.dojoSel.indexOf(j);if(at>=0)UI.dojoSel.splice(at,1);else UI.dojoSel.push(j);renderExam();return;}
  if(t.id==='dojoCheck'){UI.dojoDone=true;addHours(0.1);await save();renderExam();return;}if(t.id==='dojoNext'){UI.dojo=(UI.dojo||0)+1;UI.dojoSel=[];UI.dojoDone=false;renderExam();return;}
  if(t.id==='rpSave'){const sp=specById(UI.subject||S.setup.subjects[0].specId);const comp=document.getElementById('rpComp').value;const score=+document.getElementById('rpScore').value,total=+document.getElementById('rpTotal').value;if(!(score>=0)||!(total>0))return;S.papers.push({spec:sp.id,component:comp,series:document.getElementById('rpSeries').value.trim(),date:TODAY,score,total});addHours((sp.components.find(c=>c.id===comp)?.minutes||90)/60);await save();renderAll();return;}
  if(t.id==='bndSave'){const sp=specById(UI.subject||S.setup.subjects[0].specId);const b={};document.querySelectorAll('[data-bnd]').forEach(i=>b[i.dataset.bnd]=+i.value);S.boundaries[sp.id]=b;await save();renderAll();return;}
  if(t.id==='repCopy'){try{await navigator.clipboard.writeText(document.getElementById('repText').textContent);t.textContent='Copied';}catch(e){}return;}
  if(t.id==='tuSave'&&!AUTH_MODE){const u=document.getElementById('tuUrl').value.trim(),pw=document.getElementById('tuPass').value;if(u&&!/^https:\/\//.test(u)){document.getElementById('apiOut').innerHTML='<p class="err">The proxy address must start with https://</p>';return;}S.tutor=u?{url:u.replace(/\/$/,''),pass:pw}:null;await save();renderAll();return;}
  if(t.id==='tuClear'){S.tutor=null;await save();renderAll();return;}
  if(t.id==='apiTest'){const out=document.getElementById('apiOut');out.innerHTML='<p class="sub">Testing…</p>';const t0=Date.now();try{const txt=await callClaude([{type:'text',text:'Reply with exactly the single word OK.'}],10,1);out.innerHTML=`<div class="good">Connected in ${Date.now()-t0} ms: ${esc(txt)}</div>`;}catch(e){out.innerHTML=`<div class="remedy"><b>Failed:</b> ${esc(e.message)}<br>Where this is open: ${esc((typeof location!=='undefined'&&location.hostname)||'file')} · ${storeMode==='cloud'?'artifact storage available':'artifact storage not available'} · route: ${(S&&S.tutor&&S.tutor.url)?'your proxy':'built-in'}</div>`;}return;}
  if(t.id==='syncNow'){const out=document.getElementById('syncOut');out.innerHTML='<p class="sub">Backing up\u2026</p>';syncState.pending=true;await pushSync();out.innerHTML=syncState.err?`<p class="err">${esc(syncState.err)}</p>`:'<div class="good">Backed up.</div>';return;}
  if(t.id==='syncPull'){const out=document.getElementById('syncOut');out.innerHTML='<p class="sub">Fetching\u2026</p>';
   try{const b=await pullSync();const when=b.updatedAt?new Date(b.updatedAt).toLocaleString():'an unknown time';
    if(!confirm(`Replace the progress on this device with the copy saved from ${b.device||'a device'} at ${when}?`)){out.innerHTML='';return;}
    const route=S.tutor;S=b.state;S.tutor=route;await save();renderAll();document.getElementById('syncOut').innerHTML='<div class="good">Loaded.</div>';}
   catch(e){out.innerHTML=`<p class="err">${esc(e.message)}</p>`;}return;}
  if(t.id==='bkCopy'){try{await navigator.clipboard.writeText(JSON.stringify(S));t.textContent='Copied';}catch(e){document.getElementById('bkMsg').innerHTML=`<textarea class="mono" style="min-height:90px">${esc(JSON.stringify(S))}</textarea>`;}return;}
  if(t.id==='bkRestore'){try{const o=JSON.parse(document.getElementById('bkIn').value);if(!o.nodes||!o.setup)throw 0;S=o;await save();renderAll();document.getElementById('bkMsg').innerHTML='<div class="good">Restored.</div>';}catch(e){document.getElementById('bkMsg').innerHTML='<p class="err">Not a valid backup.</p>';}return;}
  if(t.id==='reset'){if(!confirm('This clears all progress in this platform. Copy a backup first?'))return;UI.setup={subjects:[]};S=null;try{await rawSet(KEY,'');}catch(e){}renderAll();return;}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&syncState.pending){if(syncState.timer){clearTimeout(syncState.timer);syncState.timer=null;}pushSync();}});
(async function(){storeMode=await detectStore();
  if(AUTH_MODE){const inv=hashParam('invite');if(inv){await renderInvite(inv);return;}
    const tok=await rawGet(SESSION_KEY);if(tok){AUTH.token=tok;try{AUTH.user=(await api('/auth/me')).user;}catch(e){AUTH={user:null,token:null};}}
    if(AUTH.user)await loadForUser();if(AUTH.user)go(landing());}
  else{await load();applySetupLink();}
  if(S){UI.subject=S.setup.subjects[0].specId;}renderAll();})();
</script>
