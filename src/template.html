<style>/*__CSS__*/
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.chip{border:1.5px solid var(--rule);border-radius:20px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:600;background:#fff;cursor:pointer;color:var(--pencil)}.chip[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.tcell{text-align:left;border:1.5px solid var(--rule);border-radius:3px;background:#fff;padding:10px;font:inherit;cursor:pointer;color:var(--ink)}.tcell b{display:block;font-size:12px;color:var(--pencil)}.tcell span{font-size:14px;font-weight:600;line-height:1.3;display:block;margin-top:2px}.tcell i{font-size:11.5px;color:var(--pencil)}
.tcell[data-s="Learning"]{background:#FDF6E7;border-color:var(--amber)}.tcell[data-s="Fluent"]{background:#EAF0F8;border-color:var(--blue)}.tcell[data-s="Secure"]{background:#EDF5F0;border-color:var(--green)}
.card{border:1.5px solid var(--rule);border-radius:3px;padding:22px 16px;text-align:center;background:#fff;margin-top:10px;font-size:17px;line-height:1.5}.card .back{color:var(--green);margin-top:12px;font-weight:600}

<body>

<script>
/*__CORE__*/
/*__GEN__*/

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='platform:state:v1', MATHS_KEY='companion:state:v2', SESSION_KEY='platform:session';
const AUTH_MODE=!!(typeof CONFIG!=='undefined'&&CONFIG.tutorUrl);let AUTH={user:null,token:null};
function stateKey(){return AUTH_MODE&&AUTH.user?KEY+':'+AUTH.user.username:KEY;}
let COURSES={catalogue:[],courses:{},building:{},depth:{}},SPEC_META={};const SPEC_CACHE='platform:spec:v1:';
/* Room kits: the depth the Worker wrote and checked for a built course, fetched per room and cached on the device by build stamp. */
let KITS={};const KIT_CACHE='platform:kit:v1:';
/* Hand-built kits ship with the site (KIT_INDEX, dist/kits/); Worker-built ones come from the tutor. Either way a room's kit is fetched on first open and cached by build stamp. */
function kitInfo(specId,topicId){const bi=typeof KIT_INDEX!=='undefined'&&KIT_INDEX[specId];if(bi&&bi[topicId])return {at:bi[topicId],failed:false,building:false,builtIn:true};if(bi)return null;const d=COURSES.depth&&COURSES.depth[specId];if(!d)return null;const at=d.done&&d.done[topicId];return {at:at||null,failed:(d.failed||[]).includes(topicId),building:d.status==='building'};}
async function ensureKit(specId,topicId){const info=kitInfo(specId,topicId);if(!info||!info.at)return false;const key=specId+'|'+topicId;if(KITS[key]&&KITS[key].built&&KITS[key].built.at===info.at)return false;
  try{const c=JSON.parse(await rawGet(KIT_CACHE+key)||'null');if(c&&c.built&&c.built.at===info.at){KITS[key]=c;return true;}}catch(e){}
  try{let kit;if(info.builtIn){const res=await fetch('./kits/'+encodeURIComponent(specId)+'/'+encodeURIComponent(encodeURIComponent(topicId))+'.json');if(!res.ok)return false;kit=JSON.parse(await res.text());}else{if(!AUTH_MODE)return false;kit=(await api('/courses/'+encodeURIComponent(specId)+'/kit/'+encodeURIComponent(topicId))).kit;}
    KITS[key]=kit;try{await rawSet(KIT_CACHE+key,JSON.stringify(kit));}catch(e){}return true;}catch(e){return false;}}
/* Courses built by the Worker join the built-in specs at runtime. A copy is kept on the device so a student who has a course keeps it even if it is later withdrawn for new students. */
async function loadCourses(){if(!AUTH_MODE||!AUTH.user)return;try{COURSES=await api('/courses');}catch(e){}}
async function ensureSpec(id){const stamp=x=>(x&&x.resources&&x.resources.at)||'';if(SPECS[id]&&!(SPEC_META[id]&&COURSES.courses[id]&&stamp(COURSES.courses[id])&&stamp(COURSES.courses[id])!==stamp(SPEC_META[id])))return true;
  try{const r=await api('/courses/'+encodeURIComponent(id)+'/spec');SPECS[id]=r.spec;SPEC_META[id]=r.meta;try{await rawSet(SPEC_CACHE+id,JSON.stringify(r));}catch(e){}return true;}
  catch(e){try{const c=JSON.parse(await rawGet(SPEC_CACHE+id)||'null');if(c&&c.spec){SPECS[id]=c.spec;SPEC_META[id]=c.meta;return true;}}catch(e2){}return false;}}
async function ensureSpecsFor(state){if(!state||!state.setup)return;for(const sub of state.setup.subjects)await ensureSpec(sub.specId);}
function courseIdFor(board,code){const P={'aqa':'AQA','pearson edexcel':'EDX','edexcel':'EDX','ocr':'OCR','eduqas':'EDQ','wjec':'WJEC'};return (P[String(board).toLowerCase()]||String(board).replace(/[^A-Za-z]/g,'').slice(0,5).toUpperCase())+'-'+String(code).toUpperCase();}
/* "German (International GCSE)" is offered under German, with the qualification named next to the board, so a student
   looking for German finds every German course in one list. Courses the platform already has come first. */
function splitSubject(s){const m=/^(.*?)\s*\((.+)\)\s*$/.exec(String(s||''));return m?{subject:m[1],qual:m[2]}:{subject:String(s||''),qual:''};}
function boardLabel(x){return x.board+(x.qual?' '+x.qual:'')+' '+x.code;}
function offer(level){const subj={};const put=(subject0,board,code,id,builtIn)=>{const st=COURSES.courses[id];if(st&&st.status==='retracted'&&!SPECS[id])return;const {subject,qual}=splitSubject(subject0);(subj[subject]=subj[subject]||[]);if(!subj[subject].some(x=>x.id===id))subj[subject].push({board,qual,code,id,builtIn,fullSubject:String(subject0||''),status:SPECS[id]?'ready':st?st.status:(COURSES.building[id]?'building':'none')});};
  for(const sp of Object.values(SPECS))if(sp.level===level)put(sp.subject,sp.board,sp.code,sp.id,true);
  for(const q of COURSES.catalogue)if(q.level===level)put(q.subject,q.board,q.code,q.id,false);
  const rank=x=>x.status==='ready'?0:x.status==='published'?1:x.status==='building'?2:x.status==='review'?3:4;
  for(const k of Object.keys(subj))subj[k].sort((a,b)=>rank(a)-rank(b)||a.board.localeCompare(b.board)||a.qual.localeCompare(b.qual));return subj;}
function pushSubject(id){if(!UI.setup.subjects.some(x=>x.specId===id))UI.setup.subjects.push({specId:id,options:{}});}
let S=null, TODAY=new Date().toISOString().slice(0,10), view='today', saveErr='', storeMode='memory';
let syncState={at:0,serverAt:'',busy:false,err:'',pending:false,timer:null};const SYNC_GAP=AUTH_MODE?15000:60000;
let UI={coachOpen:false,coachDraft:'',reader:{cur:null,queue:[],i:0,paused:false,speaking:false},readerPage:null,rdBlock:null,dictating:null,dictateErr:'',lastMicTarget:'',lastActive:Date.now(),lastPrompt:0,promptShown:false,promptLine:'',timer:null,itemSince:Date.now(),itemKey:'',chunkBusy:'',rdFocus:false,rdY:null,videos:{room:null,items:null,loading:false},subject:null,room:null,station:'lesson',revealed:{},practice:null,essay:null,exit:null,busy:'',err:'',coachBusy:false,coachErr:'',teach:{},setup:{subjects:[]},cards:null,mathsHours:0,drawer:null,jumpQ:'',nudgeBusy:false,desk:{room:null,items:null,loading:false,err:'',unavailable:false,filter:'all',q:'',stage:null,playing:{},busy:'',used:0,quota:0},deskAll:null};
const NUDGE_STATIONS=['lesson','cards','practise','essay','exit','desktop'];
const coachName=()=>String(S&&S.setup&&S.setup.coachName||'').trim().slice(0,24)||'Coach';
/* one colour per subject in the student's portfolio, by position, so the same course is always the same colour */
const SUBJECT_COLOURS=['#2B4C7E','#2E6B4E','#A8761B','#8E3B5C','#2E6B6B','#B3372B','#5C5B8E','#7A6A2E'];
function subjectColour(specId){const i=S&&S.setup?S.setup.subjects.findIndex(x=>x.specId===specId):-1;return SUBJECT_COLOURS[(i<0?0:i)%SUBJECT_COLOURS.length];}
/* an index card that turns over: front is the question, back the answer; `key` is the UI.revealed key that says which face is up */
function flashCardHtml(c,key,opts={}){const {spec,topic}=nodeTopic(c.node);const up=!!UI.revealed[key];const anim=UI.fcAnim===key?' unflip':'';UI.fcAnim=null;
  return `<button type="button" class="fc${opts.mini?' mini':''}${up?' flipped':anim}" data-flip="${esc(key)}" style="--sc:${subjectColour(spec.id)}" aria-pressed="${up}" aria-label="${up?'Turn back to the question':'Turn over for the answer'}"><div class="fc-inner">
   <div class="fc-face fc-front"><div class="fc-band"><span>${esc(spec.subject)}</span><span class="fc-topic">${esc(topic.name)}${c.code?` · ${esc(c.code)}`:''}</span></div><div class="fc-body">${esc(c.front)}</div><div class="fc-hint">Turn over</div></div>
   <div class="fc-face fc-back"><div class="fc-band"><span>Answer</span><span class="fc-topic">${esc(spec.subject)}</span></div><div class="fc-body">${esc(c.back)}${c.open?'<span class="fc-open">Any sound example scores — these are some of the acceptable answers. Mark yourself right if yours is as specific and as correct.</span>':''}</div><div class="fc-hint">Turn back</div></div>
  </div></button>`;}
const DESK_ON=true; /* the drawn desk at the top of every room; false leaves the station strip alone */
const specById=id=>SPECS[id];
/* A topic's id is shown as a code only when it is one — "1.2", "P3", "10.1.1", a section letter — and the name does not already
   begin with it ("A. Home and abroad"). Slug ids such as prose-mockingbird or non-topic-specific are never shown. */
function topicCode(t){const id=String(t&&t.id||''),name=String(t&&t.name||'');if(!/^(?:[A-Z]{1,2}\d+(?:\.\d+)*[a-z]?|\d+(?:\.\d+)*[a-z]?|[A-Z])$/.test(id))return '';const q=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp('^'+q+'(?=$|[\\s.:,;)\\-–—])','i').test(name)?'':id;}
/* A room’s written content: a checked kit wins; the hand-authored maths layer (src/authored) is the fallback for rooms
   without one, and still lends its verified links, official documents, boundaries and dojo to every maths room. */
const authoredFor=(specId,topicId)=>{const A=AUTHORED[specId];const k=KITS[specId+'|'+topicId];if(A&&!k){const room=A.rooms[topicId];if(!room)return null;return{room,lesson:A.lessons[topicId],sources:A.sources[topicId],official:A.official};}
  if(!k)return null;const sp=SPECS[specId];const t=sp&&sp.topics.find(x=>x.id===topicId);return{kit:k,room:{name:t?t.name:topicId,formulae:k.room.facts||[],examples:k.lesson.examples||[],questions:k.room.questions||[],exit:k.room.exit||[]},lesson:k.lesson,sources:A&&A.sources&&A.sources[topicId]||null,official:A&&A.official||null,extras:k.extras||[],cards:k.cards||[]};};
const MATHS_MODES={'ALGEBRAIC-SLIP':'RECALL-GAP','METHOD-CHOICE':'APPLICATION','CONCEPT-GAP':'KNOWLEDGE-GAP','EXAM-TECHNIQUE':'EXAM-TECHNIQUE','RECALL-GAP':'RECALL-GAP'};
const nodeTopic=id=>{const n=S.nodes[id];const sp=specById(n.spec);return {spec:sp,topic:sp.topics.find(t=>t.id===n.topic),n};};
const subjectOptions=specId=>(S.setup.subjects.find(x=>x.specId===specId)||{}).options||{};

/* ============ storage (as in the Maths companion) ============ */
async function detectStore(){try{if(window.storage&&typeof window.storage.set==='function'){const r=await window.storage.set('platform:ping','1');if(r)return 'cloud';}}catch(e){}try{localStorage.setItem('platform:ping','1');localStorage.removeItem('platform:ping');return 'local';}catch(e){}return 'memory';}
async function rawGet(k){if(storeMode==='cloud'){try{const r=await window.storage.get(k);return r&&r.value?r.value:null;}catch(e){return null;}}if(storeMode==='local'){try{return localStorage.getItem(k);}catch(e){return null;}}return null;}
async function rawSet(k,v){if(storeMode==='cloud'){const r=await window.storage.set(k,v);if(!r)throw new Error('cloud save returned nothing');return;}if(storeMode==='local'){try{localStorage.setItem(k,v);return;}catch(e){throw new Error('device storage full or blocked');}}throw new Error('no storage available');}
let MATHS=null;
async function mirrorMaths(){if(!S||!MATHS)return;if(!S.setup.subjects.some(x=>x.specId==='EDX-9MA0'))return;for(const [mid,mn] of Object.entries(MATHS.nodes||{})){const id='EDX-9MA0|'+mid;if(S.nodes[id]&&!S.nodes[id].imported){S.nodes[id].state=mn.state;S.nodes[id].lastPractised=mn.lastPractised;S.nodes[id].imported=true;}}
  for(const p of (MATHS.papers||[])){if(!S.papers.some(x=>x.mirror===p.date+p.key+p.score)){S.papers.push({spec:'EDX-9MA0',component:p.key==='P3'||p.key==='M3'?'P3':'P12',series:p.series||p.kind,date:p.date,score:p.score,total:p.total,mirror:p.date+p.key+p.score});}}}
function normaliseState(){if(!S)return;for(const k of ['errors','transitions','practice','essays','papers'])if(!S[k])S[k]=[];for(const k of ['cards','generated','coach','pins','doneToday','coldDone','checklist','boundaries','dayHours','pinned','kitCards','supportLog','chunks'])if(!S[k])S[k]={};if(S.setup)S.setup.support=normaliseSupport(S.setup.support);}
/* Signed in: the copy on the tutor is the truth; the device copy is a cache, and is adopted (and pushed) only when the tutor has nothing yet. */
async function loadForUser(){S=null;UI.room=null;let server=null;try{server=await api('/progress');}catch(e){if(e.status!==404)syncState.err=e.message;}
  let local=null;try{local=JSON.parse(await rawGet(stateKey())||'null');}catch(e){}
  if(server&&server.state&&server.state.nodes&&server.state.setup){S=server.state;syncState.at=Date.now();syncState.serverAt=server.updatedAt||'';}
  else if(local&&local.nodes&&local.setup){S=local;syncState.pending=true;}
  else{let old=null;try{old=JSON.parse(await rawGet(KEY)||'null');}catch(e){}
    const mine=old&&old.nodes&&old.setup&&AUTH.user&&String(old.setup.student||'').trim().toLowerCase()===String(AUTH.user.name||'').trim().toLowerCase();
    if(mine){S=old;syncState.pending=true;}}
  if(S)delete S.tutor;
  await loadCourses();await ensureSpecsFor(S);if(S){S.setup.subjects=S.setup.subjects.filter(sub=>SPECS[sub.specId]);if(!S.setup.subjects.length)S=null;}
  try{MATHS=JSON.parse(await rawGet(MATHS_KEY)||'null');if(MATHS&&MATHS.dayHours)UI.mathsHours=MATHS.dayHours[TODAY]||0;UI.mathsPresent=!!MATHS;}catch(e){}
  await mirrorMaths();normaliseState();if(S&&syncState.pending){await save();pushSync();}if(S)loadDeskAll();}
async function load(){let got=null;try{got=JSON.parse(await rawGet(KEY)||'null');}catch(e){}if(got&&got.nodes&&got.setup)S=got;
  try{MATHS=JSON.parse(await rawGet(MATHS_KEY)||'null');if(MATHS&&MATHS.dayHours)UI.mathsHours=MATHS.dayHours[TODAY]||0;UI.mathsPresent=!!MATHS;}catch(e){}
  await mirrorMaths();
  if(S){for(const k of ['errors','transitions','practice','essays','papers'])if(!S[k])S[k]=[];for(const k of ['cards','generated','coach','pins','doneToday','coldDone','checklist','boundaries','dayHours','pinned','kitCards','supportLog','chunks'])if(!S[k])S[k]={};if(S.setup)S.setup.support=normaliseSupport(S.setup.support);}}
async function save(){if(!S)return;if(storeMode==='memory'){saveErr='Saving isn\u2019t available where this is open — back up from Progress before you close.';return;}try{await rawSet(stateKey(),JSON.stringify(S));saveErr='';queueSync();}catch(e){saveErr=`Could not save (${e.message}). Back up from Progress.`;}renderStatus();}
/* ---- talking to the tutor service ---- */
async function api(path,opts={}){const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(AUTH.token)headers.Authorization='Bearer '+AUTH.token;
  let res;try{res=await fetch(CONFIG.tutorUrl+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});}catch(e){const err=new Error('No connection to the tutor');err.status=0;throw err;}
  let data={};try{data=JSON.parse(await res.text()||'{}');}catch(e){}
  if(res.status===401&&AUTH.token&&!/^\/auth\/(login|invite|password)/.test(path)){await signedOut();const err=new Error('Signed out');err.status=401;throw err;}
  if(!res.ok){const err=new Error(data.error||('HTTP '+res.status));err.status=res.status;throw err;}return data;}
async function signedOut(){AUTH={user:null,token:null};try{await rawSet(SESSION_KEY,'');}catch(e){}S=null;UI.room=null;UI.setup={subjects:[]};syncState={at:0,serverAt:'',busy:false,err:'',pending:false,timer:null};renderAll();}
function syncable(){return AUTH_MODE?!!(AUTH.token&&S):!!(S&&S.tutor&&S.tutor.url&&S.tutor.pass);}
function deviceName(){try{const u=(typeof navigator!=='undefined'&&navigator.userAgent)||'';return /iPad/.test(u)?'an iPad':/iPhone/.test(u)?'an iPhone':/Android/.test(u)?'an Android device':/Macintosh/.test(u)?'a Mac':/Windows/.test(u)?'a PC':'a device';}catch(e){return 'a device';}}
function queueSync(){if(!syncable())return;syncState.pending=true;if(syncState.timer)return;const wait=Math.max(2000,SYNC_GAP-(Date.now()-syncState.at));syncState.timer=setTimeout(()=>{syncState.timer=null;pushSync();},wait);}
async function pushSync(){if(!syncable()||syncState.busy||!syncState.pending)return;syncState.busy=true;
  try{let b;if(AUTH_MODE){b=await api('/progress',{method:'PUT',body:{device:deviceName(),state:S}});}
    else{const res=await fetch(S.tutor.url+'/progress',{method:'PUT',headers:{'Content-Type':'application/json','X-Passcode':S.tutor.pass},body:JSON.stringify({device:deviceName(),state:S})});if(!res.ok)throw new Error('HTTP '+res.status);b=JSON.parse(await res.text());}
    syncState.at=Date.now();syncState.serverAt=b.updatedAt||'';syncState.err='';syncState.pending=false;}
  catch(e){syncState.err=e.message||'failed';}
  finally{syncState.busy=false;if(view==='prog')renderProg();renderStatus();}}
async function pullSync(){if(!syncable())throw new Error(AUTH_MODE?'Sign in first.':'Set the tutor route first.');let b;
  if(AUTH_MODE){try{b=await api('/progress');}catch(e){throw new Error(e.status===404?'Nothing has been saved to the tutor yet.':e.message);}}
  else{const res=await fetch(S.tutor.url+'/progress',{headers:{'X-Passcode':S.tutor.pass}});if(res.status===404)throw new Error('Nothing has been backed up to the tutor yet.');if(!res.ok)throw new Error('HTTP '+res.status);b=JSON.parse(await res.text());}
  if(!b||!b.state||!b.state.nodes||!b.state.setup)throw new Error('The copy on the tutor is not readable.');return b;}
function hashParam(name){try{const h=(typeof location!=='undefined'&&location.hash)||'';const m=new RegExp('[#&]'+name+'=([^&]+)').exec(h);return m?decodeURIComponent(m[1]):'';}catch(e){return '';}}
function clearHash(){try{if(typeof history!=='undefined'&&history.replaceState)history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
/* Legacy route-less build: a setup link (#route=...&key=...) sets the tutor route in one tap. */
function applySetupLink(){if(AUTH_MODE)return;try{const u=hashParam('route').trim(),k=hashParam('key').trim();if(!/^https:\/\//.test(u)||!k)return;
  const route={url:u.replace(/\/$/,''),pass:k};if(S){S.tutor=route;save();}else{PENDING_ROUTE=route;}clearHash();}catch(e){}}
let PENDING_ROUTE=null;
function withT(id,fn){const b=S.nodes[id].state;fn();const a=S.nodes[id].state;if(b!==a)S.transitions.push({date:TODAY,node:id,from:b,to:a});}
function addHours(h){S.hours=(S.hours||0)+h;S.dayHours[TODAY]=(S.dayHours[TODAY]||0)+h;}

/* ============ API (retrying, diagnosable) ============ */
const RETRY=new Set([408,409,425,429,500,502,503,504,529]);let LAST_API_ERROR=null;
async function callClaude(parts,max=1500,retries=6,model='claude-sonnet-5'){let lastErr='';for(let a=0;a<=retries;a++){if(a)await new Promise(r=>setTimeout(r,Math.min(8000,600*Math.pow(2,a-1))+Math.random()*400));let res;

  throw new Error(lastErr||'unknown');}

async function generate(prompt,validator,max=2500){let txt=await callClaude([{type:'text',text:prompt}],max);let obj=null;try{obj=JSON.parse(txt);}catch(e){}

/* Adding a course: instant if the platform has it. Otherwise the app never starts a build (that spends the API):
   it sends Chris a request through the Worker and tells the student so. If Chris has a build running, the box joins its progress. */
async function addCourse(level,subject,boardId){const off=offer(level);const pick=(off[subject]||[]).find(x=>x.id===boardId);if(!pick)return;const id=pick.id;
  if(SPECS[id]||(await ensureSpec(id))){pushSubject(id);UI.build=null;renderSetup();return;}
  if(!AUTH_MODE){renderSetup();return;}
  UI.build={id,level,subject:pick.fullSubject||subject,board:pick.board,status:'starting',message:'Sending Chris a message…',joined:false};renderSetup();
  try{const r=await api('/courses/request',{method:'POST',body:{level,subject:pick.fullSubject||subject,board:pick.board,code:pick.code}});
    if(r.status==='published'){if(await ensureSpec(id)){pushSubject(id);UI.build=null;}renderSetup();return;}
    UI.build=Object.assign(UI.build,{status:r.status,build:r.build||null,joined:!!r.joined,message:(r.build&&r.build.message)||r.message||r.error||''});renderSetup();
    if(r.status==='building')setTimeout(()=>pollBuild(id),CONFIG.pollMs||3000);}
  catch(e){UI.build=Object.assign(UI.build,{status:'failed',message:e.message});renderSetup();}}
async function pollBuild(id){if(!UI.build||UI.build.id!==id)return;
  try{const st=await api('/courses/'+encodeURIComponent(id)+'/status');UI.build.build=st.build;UI.build.status=st.status;UI.build.message=(st.build&&st.build.message)||UI.build.message;
    if(st.status==='published'){if(await ensureSpec(id)){pushSubject(id);UI.build=null;}else{UI.build.status='failed';UI.build.message='Built, but it could not be loaded — try again.';}renderSetup();return;}
    if(st.status==='building'){renderSetup();setTimeout(()=>pollBuild(id),CONFIG.pollMs||3000);return;}
    if(st.status==='review')UI.build.message='Built, and being checked by Chris before it goes live — you can add it once it’s approved.';
    renderSetup();}
  catch(e){UI.build.status='failed';UI.build.message=e.message;renderSetup();}}
function presetBoundaries(){for(const sub of S.setup.subjects){const A=AUTHORED[sub.specId];if(A&&A.boundaries&&!S.boundaries[sub.specId]){const b=A.boundaries.overall[0];const total=300;S.boundaries[sub.specId]={};for(const g of ['A*','A','B','C','D','E'])S.boundaries[sub.specId][g]=Math.round(b[g]/total*100);}}}
function mergeSetup(newSetup){const fresh=newState(newSetup,SPECS);for(const [id,n] of Object.entries(fresh.nodes)){if(S.nodes[id])fresh.nodes[id]=S.nodes[id];}S.nodes=fresh.nodes;S.setup=newSetup;delete S.nudge;
  for(const k of ['errors','essays','practice','transitions'])S[k]=S[k].filter(x=>!x.node||S.nodes[x.node]);for(const k of Object.keys(S.cards))if(!S.nodes[S.cards[k].node])delete S.cards[k];for(const k of Object.keys(S.coachNotes||{}))if(!S.nodes[k])delete S.coachNotes[k];}
function setupValid(){const st=UI.setup;if(!st.student||!st.subjects.length)return 'Enter a name and choose at least one subject.';for(const sub of st.subjects){const sp=specById(sub.specId);for(const o of sp.options){const v=sub.options[o.id];const n=Array.isArray(v)?v.length:(v?1:0);if(n!==o.choose)return `${sp.subject}: choose exactly ${o.choose} for ${o.label}.`;}}return null;}

function subjectFlag(state,specId){const set=new Set(Object.keys(state.nodes).filter(id=>state.nodes[id].spec===specId));if(!set.size)return null;
  if(retestQueue(state,TODAY).some(e=>set.has(e.node)))return 'red';
  const interval={Learning:3,Fluent:10,Secure:28};const due=dueForReview(state,TODAY).filter(id=>set.has(id));
  if(due.some(id=>{const n=state.nodes[id];return n.lastPractised&&days(n.lastPractised,TODAY)>interval[n.state];}))return 'red';
  if(due.length||dueCards(state,TODAY).some(c=>set.has(c.node)))return 'amber';
  const sess=buildSession(state,SPECS,TODAY);const done=state.doneToday[TODAY]||[];if(sess.steps.some((x,i)=>x.kind==='new'&&!done.includes(i)&&(x.nodes||[]).some(n=>set.has(n))))return 'blue';return null;}

  const rq=retestQueue(S,TODAY).length;return {calm:!!sup().calm,subjects:subs,exam:{marker:rq?'red':null,sub:rq?`${rq} re-test${rq===1?'':'s'} due`:'papers · re-tests'},office:{marker:isAdmin()&&ADMIN_TODO?'amber':null},admin:isAdmin(),hour:new Date().getHours()};}

/* ============ REAL PAPERS: pick, photograph, mark, report ============
   The paper and its mark scheme stay on the board's site: the app links to them and the tutor passes their addresses
   to the model while marking. What the platform keeps is the student's photos, the derived question map, the marks
   and the notes. UI.pf is the attempt in progress; S.papers gets one entry per marked paper. */
UI.papers={index:{},loading:{},series:{},err:'',busy:''};UI.pf=null;UI.retest=null;
const PAPER_STEPS=['pages','assign','confirm','results','report'];
function specSummary(sp){return {id:sp.id,board:sp.board,level:sp.level,subject:sp.subject,code:sp.code,markConventions:{summary:sp.markConventions.summary},topics:sp.topics.map(t=>({id:t.id,name:t.name,ideas:(t.ideas||[]).map(i=>({code:i.code}))}))};}
async function loadPapersIndex(specId){const P=UI.papers;if(P.index[specId]||P.loading[specId])return;P.loading[specId]=true;try{const res=await fetch('./papers/'+encodeURIComponent(specId)+'.json');P.index[specId]=res.ok?JSON.parse(await res.text()):{series:[]};}catch(e){P.index[specId]={series:[]};}P.loading[specId]=false;if(S)renderExam();}
function papersOff(board){return (COURSES.papersOff||[]).includes(board);}
function seriesFor(sp){const idx=UI.papers.index[sp.id];if(!idx)return null;const pick=UI.papers.series[sp.id];return idx.series.find(s=>s.id===pick)||idx.series.find(s=>s.public)||idx.series[0]||null;}
function markedPaper(sp,series,paper){return S.papers.find(x=>x.spec===sp.id&&x.series===series&&x.paper===paper&&x.questions);}
function paperTopicName(sp,tid){const t=sp.topics.find(x=>x.id===tid);return t?t.name:tid;}
function fmtDate(d){if(!d)return '';const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function papersHtml(sp){const idx=UI.papers.index[sp.id];if(!idx){loadPapersIndex(sp.id);return `<h3>Sit a real paper</h3><p class="fine">Looking up ${esc(sp.board)}’s published papers…</p>`;}
  if(!idx.series.length)return `<h3>Sit a real paper</h3><p class="fine">No published papers are indexed for this course yet.</p>`;
  const ser=seriesFor(sp);const off=papersOff(sp.board);
  return `<h3>Sit a real paper</h3><p class="sub">${esc(sp.board)}’s own published papers, opened on ${esc(sp.board)}’s site. The newest series stay locked to teachers for a while after the exam.</p>
   <div class="pseries">${idx.series.map(s=>`<button class="pser${ser&&ser.id===s.id?' cur':''}${s.public?'':' locked'}" data-pseries="${esc(s.id)}" ${s.public?'':'disabled'}><b>${esc(s.name)}</b><small>${s.public?(()=>{const np=s.papers.filter(p=>p.qp).length,nm=s.papers.filter(p=>p.qp&&p.ms).length;return `${np} paper${np===1?'':'s'} · ${nm===np?'mark schemes':nm?`${nm} mark scheme${nm===1?'':'s'}`:'no mark schemes yet'}${s.boundariesUrl?' · boundaries':''}`;})():(s.releaseDate&&s.releaseDate>TODAY?`Locked until ${esc(fmtDate(s.releaseDate))}`:`Not yet on ${esc(sp.board)}’s site`)}</small></button>`).join('')}</div>
   ${ser&&ser.public?`<div class="plist">${ser.papers.map(p=>{const done=markedPaper(sp,ser.id,p.id);const can=p.qp&&p.ms&&!off;return `<div class="prow"><div><b>${esc(p.name)}</b><small>${esc(sp.code)}/${esc(p.id)} · ${p.marks} marks${p.minutes?` · ${p.minutes} min`:''}${p.date?` · sat ${esc(fmtDate(p.date))}`:''}${done?` · <b>marked ${esc(done.date)} · ${done.score}/${done.total}</b>`:''}</small></div><div class="row" style="margin:0">${p.qp?`<a class="act ghost small" href="${esc(p.qp)}" target="_blank" rel="noopener">Open paper ↗</a>`:'<span class="fine">Not published</span>'}${p.ms?`<a class="act ghost small" href="${esc(p.ms)}" target="_blank" rel="noopener">Mark scheme ↗</a>`:''}${done?`<button class="act ghost small" data-preport="${esc(done.id)}">See report</button>`:can?`<button class="act small" data-pmark="${esc(ser.id)}|${esc(p.id)}">Mark my answers</button>`:p.qp&&!p.ms?'<span class="fine" style="margin:0;align-self:center">Mark scheme not published, so no marking</span>':''}</div></div>`;}).join('')}</div>`:''}
   ${off?`<div class="note">Marking ${esc(sp.board)} papers is switched off for now. You can still open them.</div>`:`<div class="note">The paper and mark scheme stay on ${esc(sp.board)}’s website. Study Platform reads them while it marks and keeps nothing but your photos, your marks and its notes.</div>`}
   ${UI.papers.err?`<p class="err">${esc(UI.papers.err)}</p>`:''}`;}
/* ---- the attempt ---- */
async function startPaper(sp,seriesId,paperId){const idx=UI.papers.index[sp.id];const ser=idx.series.find(s=>s.id===seriesId);const p=ser&&ser.papers.find(x=>x.id===paperId);if(!p)return;UI.papers.err='';UI.papers.busy='start';renderExam();
  try{const r=await api('/papers',{method:'POST',body:{spec:sp.id,series:ser.id,seriesName:ser.name,paper:p.id,name:p.name,marks:p.marks,minutes:p.minutes||0,board:sp.board,level:sp.level,subject:sp.subject,code:sp.code,component:p.component||null,qp:p.qp,ms:p.ms}});
    UI.pf={id:r.attempt.id,spec:sp.id,attempt:r.attempt,step:'pages',err:'',busy:'',pick:null,slips:{},typed:null,series:ser,paper:p};if(p.minutes)startTimer(p.name,p.minutes,'paper');}
  catch(e){UI.papers.err=e.message;}UI.papers.busy='';renderExam();}
async function refreshAttempt(){const F=UI.pf;if(!F)return;const r=await api('/papers/'+encodeURIComponent(F.id));F.attempt=r.attempt;}
function questionsOf(){const F=UI.pf;return (F&&F.attempt&&F.attempt.questions&&F.attempt.questions.questions)||(F&&F.attempt&&Array.isArray(F.attempt.questions)?F.attempt.questions:[]);}
async function pfPatch(body){const F=UI.pf;const r=await api('/papers/'+encodeURIComponent(F.id),{method:'PATCH',body});F.attempt=r.attempt;}
/* pages: photographed, straightened when the paper's corners are found, kept at 1568 px on the long edge */
async function pfAddFiles(files){const F=UI.pf;if(!F)return;F.err='';for(const file of Array.from(files||[])){if((F.attempt.pages||[]).length>=40){F.err='A paper is limited to 40 pages.';break;}if(!/^image\//.test(file.type||'')){F.err='Photographs only (JPEG, PNG or WebP).';continue;}
    F.busy='upload';renderExam();
    try{let blob=file,w=null,h=null,thumb=null;
      if(canDraw()){const bmp=await createImageBitmap(file);const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));let c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
        try{const corners=deskGuessCorners(c);const area=Math.abs((corners[1][0]-corners[0][0])*(corners[2][1]-corners[1][1]));if(area>0.45*c.width*c.height&&area<0.98*c.width*c.height)c=deskWarp(c,corners);}catch(e){}
        try{deskLevels(c);}catch(e){}
        const k2=Math.min(1,1568/Math.max(c.width,c.height));if(k2<1){const t=document.createElement('canvas');t.width=Math.round(c.width*k2);t.height=Math.round(c.height*k2);t.getContext('2d').drawImage(c,0,0,t.width,t.height);c=t;}
        w=c.width;h=c.height;thumb=deskThumb(c);blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));}
      const buf=await blob.arrayBuffer();const res=await fetch(CONFIG.tutorUrl+'/papers/'+encodeURIComponent(F.id)+'/pages/upload',{method:'POST',headers:{'Authorization':'Bearer '+(AUTH.token||''),'Content-Type':blob.type||'image/jpeg','X-Page-Name':file.name||'page.jpg'},body:buf});
      let data={};try{data=JSON.parse(await res.text()||'{}');}catch(e){}if(res.status===401){await signedOut();return;}if(!res.ok)throw new Error(data.error||('HTTP '+res.status));
      F.attempt.pages=(F.attempt.pages||[]).concat([data.page]);if(thumb){try{await api('/papers/'+encodeURIComponent(F.id)+'/pages/'+encodeURIComponent(data.page.id),{method:'PATCH',body:{thumb,w,h}});data.page.thumb=thumb;}catch(e){}}}
    catch(e){F.err=e.message;}}
  F.busy='';renderExam();}
async function pfDeletePage(pid){const F=UI.pf;try{await api('/papers/'+encodeURIComponent(F.id)+'/pages/'+encodeURIComponent(pid),{method:'DELETE'});F.attempt.pages=(F.attempt.pages||[]).filter(p=>p.id!==pid);for(const q of Object.keys(F.attempt.assign||{}))F.attempt.assign[q]=(F.attempt.assign[q]||[]).filter(x=>x!==pid);}catch(e){F.err=e.message;}renderExam();}
async function pfToAssign(){const F=UI.pf;const sp=specById(F.spec);F.err='';F.busy='questions';renderExam();
  try{const r=await api('/papers/'+encodeURIComponent(F.id)+'/questions',{method:'POST',body:{spec:specSummary(sp)}});if(!r.questions){F.typed={reason:r.error||'The paper could not be read into questions.'};F.step='typed';}else{F.attempt.questions=r.questions;F.step='assign';}}
  catch(e){F.err=e.message;}F.busy='';renderExam();}
function pfAssignedPages(q){const F=UI.pf;return (F.attempt.assign&&F.attempt.assign[q])||[];}
function pfToggleAssign(q,pid){const F=UI.pf;const A=F.attempt.assign=F.attempt.assign||{};const cur=A[q]||[];A[q]=cur.includes(pid)?cur.filter(x=>x!==pid):cur.concat([pid]);if(F.attempt.attempted&&F.attempt.attempted[q]===false&&A[q].length)F.attempt.attempted[q]=true;renderExam();}
async function pfPrepare(){const F=UI.pf;const qs=questionsOf();F.err='';const conf=F.attempt.confidence||{},att=F.attempt.attempted||{};const missing=qs.filter(q=>att[q.q]!==false&&!pfAssignedPages(q.q).length);if(missing.length){F.err=`Assign a page to ${missing.slice(0,3).map(q=>'Q'+q.q).join(', ')}${missing.length>3?` and ${missing.length-3} more`:''}, or mark them as not attempted.`;renderExam();return;}
  F.busy='prepare';renderExam();try{await pfPatch({assign:F.attempt.assign||{},confidence:conf,attempted:att});await api('/papers/'+encodeURIComponent(F.id)+'/prepare',{method:'POST'});F.step='preparing';pfPoll('confirm');}catch(e){F.err=e.message;}F.busy='';renderExam();}
async function pfPoll(next){const F=UI.pf;if(!F)return;const id=F.id;const tick=async()=>{if(!UI.pf||UI.pf.id!==id)return;try{const s=await api('/papers/'+encodeURIComponent(id)+'/status');UI.pf.job=s.job;if(s.job&&s.job.status==='running'){renderExam();setTimeout(tick,2500);return;}await refreshAttempt();if(s.job&&s.job.status==='failed')UI.pf.err=s.job.message||'The tutor could not finish this step.';UI.pf.step=next;renderExam();}catch(e){UI.pf.err=e.message;renderExam();}};tick();}
async function pfMark(){const F=UI.pf;F.err='';F.busy='mark';renderExam();try{const tr={};for(const [q,t] of Object.entries(F.attempt.transcripts||{}))if(t.edited)tr[q]={transcript:t.transcript,legibility:t.legibility};await pfPatch({transcripts:tr,ticks:F.attempt.ticks||{}});await api('/papers/'+encodeURIComponent(F.id)+'/mark',{method:'POST'});F.step='marking';pfPoll('results');}catch(e){F.err=e.message;}F.busy='';renderExam();}
async function pfRemark(q,transcript){const F=UI.pf;F.err='';F.busy='remark';renderExam();try{if(transcript!=null){const T=F.attempt.transcripts=F.attempt.transcripts||{};T[q]={transcript,legibility:'ok',edited:true};await pfPatch({transcripts:{[q]:{transcript,legibility:'ok'}}});}const r=await api('/papers/'+encodeURIComponent(F.id)+'/questions/'+encodeURIComponent(q)+'/mark',{method:'POST'});F.attempt.results=F.attempt.results||{};F.attempt.results[q]=r.result;}catch(e){F.err=e.message;}F.busy='';renderExam();}
/* the paper into the student's state: rooms move, mistakes logged, re-tests queued, then the coach's note */
async function pfFinish(){const F=UI.pf;const sp=specById(F.spec);const qs=questionsOf();const R=F.attempt.results||{},T=F.attempt.transcripts||{},C=F.attempt.confidence||{},K=F.attempt.ticks||{},P=F.attempt.points||{};
  const questions=qs.map(q=>{const r=R[q.q]||{};const t=T[q.q]||{};const pts=P[q.q]&&P[q.q].points||[];const lines=(r.lines||[]).map(l=>({text:(pts[(l.i|0)-1]||{}).text||'',max:(pts[(l.i|0)-1]||{}).max||0,awarded:l.awarded||0,evidence:l.evidence||null,missing:l.missing||null}));
    const attempted=!(F.attempt.attempted&&F.attempt.attempted[q.q]===false)&&!t.blank;const agreed=K[q.q]?!(r.disagree||[]).length:null;
    return {q:q.q,marks:q.marks,awarded:r.awarded==null?(attempted?null:0):r.awarded,topic:q.topic,codes:q.codes||[],mode:q.mode,command:q.command||'',confidence:C[q.q]||null,legibility:r.legibility||t.legibility||null,attempted,failureMode:r.failureMode||null,comment:r.note||'',lines,slipGuess:F.slips[q.q]||null,selfAgreed:agreed,points:pts.map(p=>({text:p.text,max:p.max})),transcript:String(t.transcript||'').slice(0,1500),level:r.level==null?null:r.level};});
  const total=F.paper.marks||qs.reduce((a,q)=>a+q.marks,0);const score=questions.reduce((a,q)=>a+(q.awarded||0),0);
  const paper={id:F.id,spec:sp.id,component:F.paper.component||null,series:F.series.id,seriesName:F.series.name,paper:F.paper.id,name:F.paper.name,date:TODAY,score,total,status:F.step==='typed'?'typed':'marked',questions,boundaries:F.series.boundaries||null};
  paper.moves=applyPaper(S,sp,paper,TODAY);paper.grade=gradeFromBoundaries(score,paper.boundaries);
  S.papers=S.papers.filter(x=>x.id!==paper.id);S.papers.push(paper);addHours((F.paper.minutes||60)/60);await save();
  F.step='report';F.report=paper;renderExam();
  try{const rows=paperReportRows(sp,paper);const o=await generate(paperNotePrompt(sp,paper,S.setup.student||'you',coachName(),rows),o=>validatePaperNote(o),400);paper.note=o.text;await save();}catch(e){}renderExam();}
function paperReportRows(sp,paper){const sub=S.setup.subjects.find(x=>x.specId===sp.id)||{options:{}};const pr=paperPriority(S,sp,paper,sub.options);const mv=paper.moves||[];return pr.map(r=>{const m=mv.find(x=>x.topic===r.topic)||{};const modes=[...new Set((paper.questions||[]).filter(q=>questionTopic(sp,q)===r.topic&&q.failureMode&&q.failureMode!=='NONE'&&q.awarded!=null&&q.awarded<q.marks).map(q=>q.failureMode))];return {topic:r.topic,name:paperTopicName(sp,r.topic),marks:r.marks,awarded:r.awarded,lost:r.lost,weight:r.weight,priority:r.priority,before:m.before||'',after:m.after||'',modes};});}

function paperReportHtml(sp,paper){const rows=paperReportRows(sp,paper);const pct=paper.total?Math.round(100*paper.score/paper.total):0;const b=S.boundaries[sp.id]||DEFAULT_BOUNDS;const grade=paper.grade||gradeFor(pct,b);const errs=S.errors.filter(e=>e.paper===paper.id);const retest=errs.filter(e=>e.retestDue).map(e=>e.retestDue).sort()[0];

function dojoHtml(D){const i=(UI.dojo||0)%D.length;const d=D[i];const sel=UI.dojoSel||[];const done=UI.dojoDone;const right=done&&sel.slice().sort().join()===d.lost.slice().sort().join();

async function loadAdminTodo(){if(!isAdmin()||ADMIN_TODO!==null)return;ADMIN_TODO=0;try{const r=await api('/manage/reviews');setAdminTodo(r.items.length);renderRails();}catch(e){}}

function renderQuickBar(){const q=document.getElementById('qBar');if(!q)return;if(!S||(AUTH_MODE&&!AUTH.user)){q.innerHTML='';q.classList.add('hide');return;}q.classList.remove('hide');const vis=S.visited||{};
  q.innerHTML=`<span class="qlabel">Go to</span>${courseOrder().map(sub=>{const c=specById(sub.specId);if(!c)return '';const v=!!vis[c.id];return `<button class="chip qchip${v?'':' ghost'}" data-course="${esc(c.id)}" aria-current="${UI.subject===c.id&&view==='rooms'}" style="--sc:${subjectColour(c.id)}" title="${v?'':'Not visited yet — '}${esc(c.subject)}"><i></i>${esc(shortName(c))}</button>`;}).join('')}<button class="chip qchip" data-v="exam" aria-current="${view==='exam'}">◫ Exam Hall</button><button class="chip qchip" data-v="office" aria-current="${view==='office'||view==='admin'}">⌂ Office${isAdmin()&&ADMIN_TODO?`<span class="nbadge">${ADMIN_TODO}</span>`:''}</button>`;}
function courseOrder(){const pinned=S.pinned||{};return S.setup.subjects.slice().sort((a,b)=>(pinned[b.specId]?1:0)-(pinned[a.specId]?1:0));}
function activeSpec(){return specById((UI.subject&&S.setup.subjects.some(x=>x.specId===UI.subject))?UI.subject:S.setup.subjects[0].specId);}
function jumpMatches(q){q=String(q||'').trim().toLowerCase();if(q.length<2)return [];const first=[],later=[];
  for(const sub of S.setup.subjects){const sp=specById(sub.specId);if(!sp)continue;for(const [id,n] of Object.entries(S.nodes)){if(n.spec!==sp.id)continue;const t=sp.topics.find(x=>x.id===n.topic);if(!t)continue;
    if(t.name.toLowerCase().includes(q)||String(t.id).toLowerCase().includes(q))first.push({id,sp,t,hit:null});
    else{const k=(t.ideas||[]).find(i=>String(i.code).toLowerCase().includes(q)||String(i.idea||'').toLowerCase().includes(q)||String(i.content||'').toLowerCase().includes(q));if(k)later.push({id,sp,t,hit:k});}}}
  return first.concat(later).slice(0,8);}
function jumpHtml(){if(String(UI.jumpQ||'').trim().length<2)return '';const m=jumpMatches(UI.jumpQ);return m.length?m.map(x=>`<button class="tnode" data-open="${esc(x.id)}" data-st="lesson"><i class="dot" data-s="${S.nodes[x.id].state}"></i><span><small>${esc(x.sp.subject)}${topicCode(x.t)?` · ${esc(topicCode(x.t))}`:''}</small> ${esc(x.t.name)}${x.hit?`<br><small>${esc(x.hit.code)} ${esc(x.hit.idea)}</small>`:''}</span></button>`).join(''):'<div class="empty">No topic matches.</div>';}

/* Videos for the room: the Worker searches YouTube, a model keeps the ones that teach this topic, each is checked to exist,

    html+=`<div class="rblock"><h4>${esc(sp.subject)} · ${esc(sp.board)} ${esc(sp.code)}</h4>${sp.components.map(c=>`<div class="mstone"><span>${esc(c.name)}</span><b>${c.weight}%</b></div>`).join('')}</div><div class="rblock"><h4>Rooms</h4>${['Secure','Fluent','Learning','Unassessed'].map(st=>`<div class="mstone"><span><i class="dot" data-s="${st}" style="display:inline-block;vertical-align:middle;margin:0 6px 2px 0"></i>${st==='Unassessed'?'Not started':st}</span><b>${by[st]||0}</b></div>`).join('')}${nt?`<button class="act small" data-open="${esc(next[0])}" data-st="lesson">Start ${esc(nt.name)} →</button>`:'<p class="fine">Every room started.</p>'}</div>`;html+=deskCourseRailHtml(sp);}
  else if(view==='exam'){const sp=activeSpec();const mc=sp.markConventions||{};
    html+=`<div class="rblock"><h4>Command words · ${esc(sp.board)}</h4>${(mc.commandWords||[]).map(c=>`<div class="cw"><b>${esc(c.word)}</b>${esc(c.means)}</div>`).join('')}</div>`;
    if(mc.essayShapes&&mc.essayShapes.length)html+=`<div class="rblock"><h4>Essay shapes</h4>${mc.essayShapes.map(x=>`<div class="cw"><b>${x.marks} marks · ${x.minutes} min</b>${esc(x.structure)}</div>`).join('')}</div>`;

  else if(view==='prog'){const modes={};for(const e of S.errors)modes[e.mode]=(modes[e.mode]||0)+1;const dom=Object.keys(modes).sort((a,b)=>modes[b]-modes[a])[0];const rep=weeklyReport(S,SPECS,TODAY);

function renderStatus(){const el=document.getElementById('status');if(!el)return;try{document.body.classList.toggle('status-on',statusView());}catch(e){}if(!statusView()){el.innerHTML='';return;}const due=dueCards(S,TODAY).length;const n=streakDays(S,TODAY);const mins=Math.round((S.dayHours[TODAY]||0)*60);

/* The next-step nudge: one small tutor call a day, cached in state; a deterministic sentence when the tutor cannot be asked. */
function courseKey(){return S&&S.setup?S.setup.subjects.map(x=>x.specId).sort().join(","):"";}
function nudgeStale(){return !(S&&S.nudge&&S.nudge.date===TODAY&&S.nudge.courses===courseKey());}
async function requestNudge(force){if(!S||UI.nudgeBusy)return;if(!force&&!nudgeStale())return;UI.nudgeBusy=true;renderCampus();
  try{const txt=await callClaude([{type:'text',text:nudgePrompt(S,SPECS,TODAY,registerBlock(sup()))}],300,0);let o=null;try{o=JSON.parse(txt);}catch(e){}

/* ============ THE COACH'S WEEKLY POST-IT — one small call per room per week, only when there is something to read ============ */
function roomLog(room){const n=S.nodes[room];const recent=x=>x.node===room&&days(x.date,TODAY)<=30;const pr=S.practice.filter(p=>recent(p)&&p.kind!=='mark');const mk=S.practice.filter(p=>recent(p)&&p.kind==='mark');const es=S.essays.filter(recent).slice(-3);const er=S.errors.filter(recent).slice(0,5);
  const deck=Object.values(S.cards).filter(c=>c.node===room);const due=deck.filter(c=>!c.due||c.due<=TODAY).length;const lines=[];
  lines.push(`State: ${n.state}${n.lastPractised?`, last worked ${n.lastPractised}`:''}${n.taught?`, exit ticket passed ${n.taught}`:''}.`);
  for(const d of [1,2,3]){const q=pr.filter(p=>p.d===d);if(q.length)lines.push(`${['','Standard','Exam-standard','Hard'][d]} questions (30 days): ${q.filter(p=>p.ok).length} right of ${q.length}, ${q.reduce((a,b)=>a+(b.hints||0),0)} hints.`);}
  const und=pr.filter(p=>!p.d);if(und.length)lines.push(`Other practice: ${und.filter(p=>p.ok).length} right of ${und.length}.`);
  if(mk.length)lines.push(`Marked answers: ${mk.length}, ${mk.filter(p=>p.ok).length} at full marks.`);
  for(const e of es)lines.push(`Essay ${e.date}: level ${e.level}/${e.maxLevel}, ${e.mark}/${e.max}${e.mode&&e.mode!=='NONE'?`, ${e.mode}`:''}: ${String(e.q||'').slice(0,80)}`);
  for(const e of er)lines.push(`Mistake ${e.date}: ${e.mode} — ${String(e.ref||'').slice(0,80)}`);
  lines.push(`Cards: ${deck.length} in the deck, ${due} due today.`);
  const active=!!(pr.length||mk.length||es.length||er.length||n.taught||n.state!=='Unassessed');
  return {text:lines.join('\n'),sig:`${n.state}|${pr.length}|${mk.length}|${es.length}|${er.length}|${n.taught||''}`,active};}
async function ensureCoachNote(room){if(!S||!S.nodes[room])return;const L=roomLog(room);if(!L.active)return;S.coachNotes=S.coachNotes||{};const cur=S.coachNotes[room];if(cur&&(cur.sig===L.sig||days(cur.at,TODAY)<7))return;
  UI.noteBusy=UI.noteBusy||{};UI.noteTried=UI.noteTried||{};if(UI.noteBusy[room]||UI.noteTried[room]===TODAY)return;UI.noteBusy[room]=true;if(UI.room===room)renderRooms();
  try{const {spec,topic}=nodeTopic(room);const txt=await callClaude([{type:'text',text:weeklyNotePrompt(spec,topic,S.setup.student,coachName(),L.text,{support:sup()})}],200,1,'claude-haiku-4-5');let o=null;try{o=JSON.parse(txt);}catch(e){}
    if(!S||!S.nodes[room])return;if(!o||typeof o.text!=='string'||!o.text.trim())throw new Error('no note');S.coachNotes[room]={at:TODAY,text:o.text.trim().slice(0,160),sig:L.sig,ai:true};await save();}
  catch(e){UI.noteTried[room]=TODAY;}finally{UI.noteBusy[room]=false;}if(UI.room===room)renderRooms();}

/* ============ THE DRAWN DESK — the room's state as objects on a desk; each opens the station beneath ============ */
function deskItems(){if(UI.desk.room===UI.room&&UI.desk.items)return UI.desk.items;const A=UI.deskAll&&UI.deskAll.rooms&&UI.deskAll.rooms[UI.room];return A?(A.latest||[]):[];}
function deskCount(){if(UI.desk.room===UI.room&&UI.desk.items)return UI.desk.items.length;const A=UI.deskAll&&UI.deskAll.rooms&&UI.deskAll.rooms[UI.room];return A?A.count:0;}
function wrapLines(text,chars,max){const words=String(text||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);const out=[];let cur='';for(const w of words){if(out.length>=max)break;if(cur&&(cur+' '+w).length>chars){out.push(cur);cur=w;}else cur=cur?cur+' '+w:w;}if(cur&&out.length<max)out.push(cur);const shown=out.join(' ');if(shown.length<words.join(' ').length&&out.length)out[out.length-1]=out[out.length-1].slice(0,chars-1).replace(/[.,;:\s]+$/,'')+'…';return out;}
function mmss(sec){sec=Math.floor(sec||0);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;}
function deskHtml(spec,topic,n,AU,factsLabel){const room=UI.room,st=n.state,items=deskItems(),CN=coachName();
  const deck=Object.values(S.cards).filter(c=>c.node===room);const due=deck.filter(c=>!c.due||c.due<=TODAY).length;const kitCards=AU&&AU.cards&&AU.cards.length&&!(S.kitCards||{})[room]?AU.cards.length:0;
  const dte=daysToExam(S.setup,TODAY);const sess=buildSession(S,SPECS,TODAY);const steps=sess.steps||[];const mins=steps.reduce((a,b)=>a+b.minutes,0);const phase=phaseFor(TODAY);
  const N=nudgeStale()?null:S.nudge;const mine=items.find(x=>x.kind==='note');const photo=items.find(x=>x.kind==='photo'&&x.thumb)||items.find(x=>x.kind==='photo');const photos=items.filter(x=>x.kind==='photo').length;const video=items.find(x=>x.kind==='video');
  const piles=pileCounts(AU?AU.room.questions:[],S.practice,room);const essays=S.essays.filter(e=>e.node===room);const lastE=essays[essays.length-1];const marked=S.practice.filter(p=>p.node===room&&p.kind==='mark').length;const cnt=deskCount();
  const cnote=(S.coachNotes||{})[room];const noteBusy=UI.noteBusy&&UI.noteBusy[room];const L=roomLog(room);

const canDraw=()=>typeof createImageBitmap==='function'&&typeof document.createElement==='function'&&(()=>{try{return !!document.createElement('canvas').getContext('2d');}catch(e){return false;}})();
async function deskChoose(file,kind){const D=UI.desk;D.err='';if(!file)return;if(file.size>8*1024*1024&&!(kind==='photo'&&canDraw())){D.err='Files are limited to 8 MB.';renderRooms();return;}
  if(kind==='photo'&&/^image\//.test(file.type||'')&&canDraw()){try{const bmp=await createImageBitmap(file);const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));const w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
      D.stage={name:file.name||'photo.jpg',w,h,canvas:c,dataUrl:c.toDataURL('image/jpeg',0.8),corners:deskGuessCorners(c)};renderRooms();return;}catch(e){}}
  await deskUpload(file,kind,file.name||(kind==='photo'?'photo.jpg':'file'),file.type||'application/octet-stream',null);}
function deskGuessCorners(c){const w=c.width,h=c.height;const full=[[0,0],[w,0],[w,h],[0,h]];try{const sw=96,sh=Math.max(1,Math.round(h/w*96));const t=document.createElement('canvas');t.width=sw;t.height=sh;const g=t.getContext('2d');g.drawImage(c,0,0,sw,sh);const d=g.getImageData(0,0,sw,sh).data;const lum=[];for(let i=0;i<d.length;i+=4)lum.push(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);const sorted=[...lum].sort((a,b)=>a-b);const thr=(sorted[Math.floor(sorted.length*0.5)]+sorted[sorted.length-1])/2;let x0=sw,y0=sh,x1=0,y1=0,n=0;for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)if(lum[y*sw+x]>=thr){n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    if(n<sw*sh*0.3||(x1-x0)*(y1-y0)<sw*sh*0.3)return full;const fx=w/sw,fy=h/sh;return [[x0*fx,y0*fy],[(x1+1)*fx,y0*fy],[(x1+1)*fx,(y1+1)*fy],[x0*fx,(y1+1)*fy]];}catch(e){return full;}}
/* The 3×3 homography that maps the four destination corners onto the four source corners, by Gaussian elimination. */
function deskHomography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const [x,y]=dst[i],[u,v]=src[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}
  const n=8;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];const d=A[c][c]||1e-9;for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/d;for(let k=c;k<n;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c];}}
  const hh=b.map((v,i)=>v/(A[i][i]||1e-9));return [hh[0],hh[1],hh[2],hh[3],hh[4],hh[5],hh[6],hh[7],1];}
function deskWarp(c,corners){const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);let W=Math.round(Math.max(dist(corners[0],corners[1]),dist(corners[3],corners[2]))),H=Math.round(Math.max(dist(corners[0],corners[3]),dist(corners[1],corners[2])));const k=Math.min(1,2000/Math.max(W,H));W=Math.max(8,Math.round(W*k));H=Math.max(8,Math.round(H*k));
  const Hm=deskHomography(corners,[[0,0],[W,0],[W,H],[0,H]]);const src=c.getContext('2d').getImageData(0,0,c.width,c.height),sd=src.data,sw=c.width,sh=c.height;const out=document.createElement('canvas');out.width=W;out.height=H;const og=out.getContext('2d');const o=og.createImageData(W,H),od=o.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const den=Hm[6]*x+Hm[7]*y+1;const u=(Hm[0]*x+Hm[1]*y+Hm[2])/den,v=(Hm[3]*x+Hm[4]*y+Hm[5])/den;const sx=Math.round(u),sy=Math.round(v);const oi=(y*W+x)*4;if(sx<0||sy<0||sx>=sw||sy>=sh){od[oi]=od[oi+1]=od[oi+2]=255;od[oi+3]=255;continue;}const si=(sy*sw+sx)*4;od[oi]=sd[si];od[oi+1]=sd[si+1];od[oi+2]=sd[si+2];od[oi+3]=255;}
  og.putImageData(o,0,0);return out;}
/* Levels: stretch the page so its paper reads white and its ink dark, without touching colour balance much. */
function deskLevels(c){const g=c.getContext('2d');const im=g.getImageData(0,0,c.width,c.height),d=im.data;const hist=new Array(256).fill(0);for(let i=0;i<d.length;i+=4)hist[Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])]++;const total=d.length/4;let acc=0,lo=0,hi=255;for(let i=0;i<256;i++){acc+=hist[i];if(acc>=total*0.02){lo=i;break;}}acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>=total*0.02){hi=i;break;}}if(hi-lo<40)return c;const scale=255/(hi-lo);
  for(let i=0;i<d.length;i+=4){for(let k=0;k<3;k++){let v=(d[i+k]-lo)*scale;d[i+k]=v<0?0:v>255?255:v;}}g.putImageData(im,0,0);return c;}
function deskThumb(c){let w=320;for(const q of [0.7,0.6,0.5]){const t=document.createElement('canvas');const k=Math.min(1,w/Math.max(c.width,c.height));t.width=Math.max(1,Math.round(c.width*k));t.height=Math.max(1,Math.round(c.height*k));t.getContext('2d').drawImage(c,0,0,t.width,t.height);const u=t.toDataURL('image/jpeg',q);if(u.length<=24000)return u;w=240;}return null;}
const canvasBlob=(c,type,q)=>new Promise(res=>c.toBlob(b=>res(b),type,q));

function bufToB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function deskUpload(blob,kind,name,type,meta){const D=UI.desk;D.busy='upload';D.err='';renderRooms();const room=UI.room;
  try{const buf=await blob.arrayBuffer();const res=await fetch(CONFIG.tutorUrl+'/desk/'+encodeURIComponent(room)+'/upload',{method:'POST',headers:{'Authorization':'Bearer '+(AUTH.token||''),'Content-Type':type,'X-Desk-Name':name,'X-Desk-Kind':kind},body:buf});
    let data={};try{data=JSON.parse(await res.text()||'{}');}catch(e){}if(res.status===401){await signedOut();return;}if(!res.ok)throw new Error(data.error||('HTTP '+res.status));
